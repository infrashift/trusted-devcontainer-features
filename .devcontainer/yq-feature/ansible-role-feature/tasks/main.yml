# yq-feature/ansible-role-feature/tasks/main.yml
---
# Assert that the devcontainer variant is compatible with this role
- name: Assert that _securedevcontainer_variant is in the _securedevcontainer_compatibility_list
  ansible.builtin.assert:
    that: _securedevcontainer_variant in _securedevcontainer_compatibility_list
    fail_msg: "_securedevcontainer_variant = '{{ _securedevcontainer_variant }}' is NOT in the _securedevcontainer_compatibility_list = '{{ _securedevcontainer_compatibility_list }}'."
    success_msg: "_securedevcontainer_variant = '{{ _securedevcontainer_variant }}' is in the _securedevcontainer_compatibility_list = '{{ _securedevcontainer_compatibility_list }}'."

- name: Extract the UBI version number from _securedevcontainer_variant
  ansible.builtin.set_fact:
    _securedevcontainer_ubi_version: "{{ _securedevcontainer_variant | regex_replace('^.*?(\\d+)$', '\\1') }}"

- name: Display _securedevcontainer_ubi_version
  ansible.builtin.debug:
    msg: "UBI version number: {{ _securedevcontainer_ubi_version }}"

# yq installation tasks
- name: Check if yq is already installed
  ansible.builtin.command: "{{ _target_user_home }}/.local/bin/yq --version"
  ignore_errors: true
  register: _yq_version_result
  changed_when: false

- name: Create temporary download directory
  ansible.builtin.file:
    path: /tmp/yq-feature-install
    state: directory
    mode: '0755'
  when:
    - _yq_version_result is failed or _yq_version not in _yq_version_result.stdout
    - _yq_checksum | default('', true) | length == 0

- name: Download yq checksums file
  ansible.builtin.get_url:
    url: "{{ _yq_checksums_download_url }}"
    dest: "/tmp/yq-feature-install/checksums"
  when:
    - _yq_version_result is failed or _yq_version not in _yq_version_result.stdout
    - _yq_checksum | default('', true) | length == 0

- name: Read checksums file
  ansible.builtin.slurp:
    src: "/tmp/yq-feature-install/checksums"
  register: _yq_checksums_file_content
  when: _yq_checksum | default('', true) | length == 0

- name: Find the checksum for {{ _yq_binary }}
  ansible.builtin.set_fact:
    _yq_checksum: "{{ item.split()[0] }}"
  when:
    - _yq_checksum | default('', true) | length == 0
    - _yq_binary in item
    - "'.tar.gz' not in item"
  loop: "{{ _yq_checksums_file_content.content | b64decode | split('\n') | reject('eq', '') | list }}"

- name: Display the checksum
  ansible.builtin.debug:
    msg: "Checksum for {{ _yq_binary }} is: {{ _yq_checksum }}"
  when: _yq_checksum | default('', true) | length > 0

- name: Ensure ~/.local/bin directory exists
  ansible.builtin.file:
    path: "{{ _target_user_home }}/.local/bin"
    state: directory
    mode: '0755'
    owner: "{{ _target_username }}"
    group: "{{ _target_username }}"

- name: Download yq binary
  ansible.builtin.get_url:
    url: "{{ _yq_download_url }}"
    dest: "{{ _target_user_home }}/.local/bin/yq"
    checksum: "{{ 'sha256:' + _yq_checksum if _yq_checksum | default('', true) | length > 0 else omit }}"
    owner: "{{ _target_username }}"
    group: "{{ _target_username }}"
    mode: '0755'
  when: _yq_version_result is failed
        or _yq_version not in _yq_version_result.stdout

- name: Remove temporary download directory
  ansible.builtin.file:
    path: /tmp/yq-feature-install
    state: absent

- name: Get yq version
  ansible.builtin.command:
    cmd: "{{ _target_user_home }}/.local/bin/yq --version"
  register: _yq_version_result

- name: Assert that yq is installed and accessible
  ansible.builtin.assert:
    that: "'yq' in _yq_version_result.stdout"
    fail_msg: "{{ _yq_version_result.stdout }}"
    success_msg: "{{ _yq_version_result.stdout }}"

# Cleanup
- name: Unset _securedevcontainer_ubi_version
  ansible.builtin.set_fact:
    _securedevcontainer_ubi_version: null
...
