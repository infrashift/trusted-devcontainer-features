# pnpm-feature/ansible-role-feature/tasks/main.yml
---
# Assert that the devcontainer variant is compatible with this role
- name: Assert that _securedevcontainer_variant is in the _securedevcontainer_compatibility_list
  ansible.builtin.assert:
    that: _securedevcontainer_variant in _securedevcontainer_compatibility_list
    fail_msg: "_securedevcontainer_variant = '{{ _securedevcontainer_variant }}' is NOT in the _securedevcontainer_compatibility_list = '{{ _securedevcontainer_compatibility_list }}'."
    success_msg: "_securedevcontainer_variant = '{{ _securedevcontainer_variant }}' is in the _securedevcontainer_compatibility_list = '{{ _securedevcontainer_compatibility_list }}'."

- name: Extract the UBI version number from _securedevcontainer_variant
  ansible.builtin.set_fact:
    _securedevcontainer_ubi_version: "{{ _securedevcontainer_variant | regex_replace('^.*?(\\d+)$', '\\1') }}"

- name: Display _securedevcontainer_ubi_version
  ansible.builtin.debug:
    msg: "UBI version number: {{ _securedevcontainer_ubi_version }}"

# pnpm installation tasks
- name: Check if pnpm is already installed
  ansible.builtin.command: "{{ _target_user_home }}/.local/share/pnpm/pnpm --version"
  ignore_errors: true
  register: _pnpm_version_result
  changed_when: false

- name: Ensure ~/.local/share/pnpm directory exists
  ansible.builtin.file:
    path: "{{ _target_user_home }}/.local/share/pnpm"
    state: directory
    mode: '0755'
    owner: "{{ _target_username }}"
    group: "{{ _target_username }}"

- name: Download pnpm standalone binary
  ansible.builtin.get_url:
    url: "{{ _pnpm_download_url }}"
    dest: "{{ _target_user_home }}/.local/share/pnpm/pnpm"
    checksum: "{{ 'sha256:' + _pnpm_checksum if _pnpm_checksum | default('', true) | length > 0 else omit }}"
    owner: "{{ _target_username }}"
    group: "{{ _target_username }}"
    mode: '0755'
  when: _pnpm_version_result is failed
        or _pnpm_version not in _pnpm_version_result.stdout

- name: Get pnpm version
  ansible.builtin.command:
    cmd: "{{ _target_user_home }}/.local/share/pnpm/pnpm --version"
  environment:
    PATH: "{{ _target_user_home }}/.local/share/nodejs/bin:{{ _target_user_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
  register: _pnpm_version_result

- name: Assert that pnpm is installed and accessible
  ansible.builtin.assert:
    that: "_pnpm_version in _pnpm_version_result.stdout"
    fail_msg: "{{ _pnpm_version_result.stdout }}"
    success_msg: "pnpm {{ _pnpm_version_result.stdout }} installed successfully"

# Cleanup
- name: Unset _securedevcontainer_ubi_version
  ansible.builtin.set_fact:
    _securedevcontainer_ubi_version: null
...
