name: Release Dev Container Features

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  # The contract gate is cheap and container-free, so the release always waits
  # for it. Without this, a feature that violates the contract still publishes:
  # release.yaml previously had no `needs:` at all.
  contract:
    name: "role contract"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the ADR-012 parameter contract
        run: bash scripts/check-role-contract.sh

  release:
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish features
        uses: devcontainers/action@v1
        with:
          publish-features: "true"
          base-path-to-features: "./src"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
