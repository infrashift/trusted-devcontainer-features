name: Test Dev Container Features

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: "test (${{ matrix.feature }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          - ansible-core
          - bun
          - claude-code
          - cuelang
          - dotnet
          - egress-filter
          - git
          - git-lfs
          - golang
          - grype
          - jq
          - nodejs
          - npm
          - openai-codex
          - openjdk
          - pnpm
          - python
          - syft
          - uv-ruff
          - yq
    steps:
      - uses: actions/checkout@v4

      - name: Build UBI9 base image
        run: |
          docker build -t devcontainer-features-test-base:ubi9 \
            -f .devcontainer/Containerfile .devcontainer/

      - name: Run autogenerated tests
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            npx @devcontainers/cli features test -p . \
              -f ${{ matrix.feature }} \
              -i devcontainer-features-test-base:ubi9 \
              -u vscode \
              --skip-scenarios

  test-scenarios:
    name: "scenario (${{ matrix.feature }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          - ansible-core
          - claude-code
          - cuelang
          - egress-filter
          - git-lfs
          - npm
          - openai-codex
          - pnpm
          - python
    steps:
      - uses: actions/checkout@v4

      - name: Build UBI9 base image
        run: |
          docker build -t devcontainer-features-test-base:ubi9 \
            -f .devcontainer/Containerfile .devcontainer/

      - name: Run scenario tests
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            npx @devcontainers/cli features test -p . \
              -f ${{ matrix.feature }} \
              --skip-autogenerated

  test-global:
    name: "global integration"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build UBI9 base image
        run: |
          docker build -t devcontainer-features-test-base:ubi9 \
            -f .devcontainer/Containerfile .devcontainer/

      - name: Run global integration tests
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            npx @devcontainers/cli features test -p . \
              --global-scenarios-only
