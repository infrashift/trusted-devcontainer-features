name: PR Gate

# Reports on EVERY pull request, including ones that touch nothing buildable.
#
# Deliberately NOT path-filtered. A path-filtered workflow simply does not run,
# and its required contexts never appear, so a docs-only PR would wait forever
# on a check that will never report. scripts/lint-workflows.sh enforces this.

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repo-gate:
    name: repo-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # gitleaks scans history. A key that was committed and then removed is
          # still a leaked key, and only a full clone can see it.
          fetch-depth: 0

      - name: Install pinned tools
        run: sudo BIN=/usr/local/bin ./scripts/install-tools.sh opa gitleaks

      - name: Guard the secret scanner config
        # Guard #2 of three. An empty .gitleaks.toml means ZERO rules: gitleaks
        # scans, finds nothing, exits 0. Indistinguishable from a clean scan.
        run: |
          set -euo pipefail
          bytes=$(stat -c%s .gitleaks.toml)
          [ "$bytes" -ge 64 ] || { echo "::error::.gitleaks.toml is ${bytes} bytes -- an empty config disables every rule"; exit 1; }
          grep -qE 'useDefault[[:space:]]*=[[:space:]]*true' .gitleaks.toml \
            || { echo "::error::.gitleaks.toml must set [extend] useDefault = true"; exit 1; }

      - name: Verify the ADR-012 parameter contract
        # The contract gate is cheap and container-free, so everything waits on
        # it. Its logic lives in one script called from here and from `make
        # check-contract` -- the templates repo duplicated an equivalent check
        # between its Makefile and its workflow and a file escaped both.
        run: ./scripts/check-role-contract.sh

      - name: Assert a single authoritative policy
        run: ./scripts/check-no-orphan-rego.sh

      - name: Lint workflows for drift
        run: ./scripts/lint-workflows.sh

      - name: Lint shell
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning scripts/*.sh

      - name: Policy self-test
        run: |
          set -euo pipefail
          opa check --strict .github/pdp/
          out=$(opa fmt --list .github/pdp/)
          if [ -n "$out" ]; then echo "::error::rego needs formatting: $out"; exit 1; fi
          opa test .github/pdp/ | tail -1
          cov=$(opa test .github/pdp/ --coverage --format json | jq -r '.coverage')
          printf 'coverage: %.1f%%\n' "$cov"
          awk -v c="$cov" 'BEGIN{ if (c+0 < 85) { print "coverage below 85% threshold" > "/dev/stderr"; exit 1 } }'

      - name: Evaluate data.tdf.pdp.repo_decision
        # Builds the OPA input from MEASURED facts -- real config size, real scan
        # output, real tools.lock, real workflow refs -- never from asserted
        # literals. A sibling repo wrote "gitleaks_passed": true into a signed
        # attestation while its config was 0 bytes.
        run: ./scripts/repo-gate.sh repo-decision.json

      - name: Summarise
        if: always()
        run: |
          set -euo pipefail
          [ -f repo-decision.json ] || exit 0
          {
            echo "## Repo gate"
            echo
            echo "- allow: \`$(jq -r '.allow' repo-decision.json)\`"
            echo "- violations: $(jq -r '.counts.violations' repo-decision.json)"
            jq -r '.violations[]? | "  - **\(.code)** \(.message)"' repo-decision.json
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: repo-decision
          path: repo-decision.json
          if-no-files-found: ignore
