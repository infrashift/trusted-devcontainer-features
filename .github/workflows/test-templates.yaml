name: Test Features in Templates

# Builds each test template against the features in the working tree and runs
# its smoke and contract tests. The contract check itself lives in pr-gate.yml,
# which runs on every PR; this workflow is path-filtered because building six
# containers for a docs-only change is waste.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test-templates/**'
      - 'scripts/**'
      - 'tools.lock'
      - '.github/workflows/test-templates.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'test-templates/**'
      - 'scripts/**'
      - 'tools.lock'
      - '.github/workflows/test-templates.yaml'

permissions: {}

concurrency:
  group: test-templates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  matrix-setup:
    name: Compute Matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      templates: ${{ steps.compute.outputs.templates }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0   # need history to diff against the PR base

      - name: Select the templates this change can affect
        id: compute
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # A push to main has no PR base to diff against, and main is what the
          # release publishes from -- build everything.
          if [ "$EVENT" = "push" ]; then
            t=$(./scripts/compute-test-matrix.sh --all)
          else
            t=$(./scripts/compute-test-matrix.sh "$BASE_SHA")
          fi
          echo "templates=$t" >> "$GITHUB_OUTPUT"
          echo "selected: $t"

  test:
    name: template (${{ matrix.template }}, ${{ matrix.arch }})
    needs: matrix-setup
    if: needs.matrix-setup.outputs.templates != '[]'
    # Native runners, not qemu. These roles execute the binaries they install to
    # assert versions, so under emulation a failure is ambiguous between the tool
    # and the emulator -- and a per-arch checksum verified under emulation proves
    # less than one verified on the metal.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix-setup.outputs.templates) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install pinned tools
        run: sudo BIN=/usr/local/bin ./scripts/install-tools.sh devcontainer-cli

      - name: Prepare test template
        env:
          # Matrix values reach the shell through env, never through `${{ }}`
          # interpolation inside the run: block.
          TEMPLATE: ${{ matrix.template }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          cp -r src/* "test-templates/${TEMPLATE}/.devcontainer/"
          cp test-templates/shared/test-lib.sh "test-templates/${TEMPLATE}/"

      - name: Build and start devcontainer
        env:
          TEMPLATE: ${{ matrix.template }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          devcontainer up \
            --workspace-folder "$(pwd)/test-templates/${TEMPLATE}" \
            --id-label "test=${TEMPLATE}-${ARCH}"

      - name: Run tests
        env:
          TEMPLATE: ${{ matrix.template }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          devcontainer exec \
            --workspace-folder "$(pwd)/test-templates/${TEMPLATE}" \
            --id-label "test=${TEMPLATE}-${ARCH}" \
            bash tests.sh

      - name: Run contract tests (idempotency + failure modes)
        env:
          TEMPLATE: ${{ matrix.template }}
          ARCH: ${{ matrix.arch }}
        run: bash test-templates/shared/contract-tests.sh "${TEMPLATE}" "${TEMPLATE}-${ARCH}"

      - name: Cleanup
        if: always()
        env:
          TEMPLATE: ${{ matrix.template }}
          ARCH: ${{ matrix.arch }}
        run: docker ps -q --filter "label=test=${TEMPLATE}-${ARCH}" | xargs -r docker rm -f

  # A single aggregate context. NEVER make individual matrix legs required
  # checks: job names change with the matrix, and a required context that stops
  # reporting blocks every PR forever.
  gate:
    name: test/gate
    needs: [matrix-setup, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate
        env:
          TEST: ${{ needs.test.result }}
          SETUP: ${{ needs.matrix-setup.result }}
          SELECTED: ${{ needs.matrix-setup.outputs.templates }}
        run: |
          set -euo pipefail
          echo "matrix-setup=$SETUP  test=$TEST  selected=$SELECTED"

          # If the matrix could not be computed we know nothing about coverage.
          [ "$SETUP" = "success" ] || { echo "::error::matrix-setup did not succeed (${SETUP})"; exit 1; }

          # `skipped` is legitimate ONLY because nothing needed building. It is
          # reported either way so the reason is visible in the log rather than
          # inferred from a green check.
          case "$TEST" in
            success) echo "all selected template/arch legs succeeded" ;;
            skipped)
              if [ "$SELECTED" = "[]" ]; then
                echo "no template installs any changed feature; nothing to build"
              else
                echo "::error::entries were selected (${SELECTED}) but the test job did not run"
                exit 1
              fi
              ;;
            *) echo "::error::a template leg did not succeed (${TEST})"; exit 1 ;;
          esac
