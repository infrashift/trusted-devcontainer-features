# npm-feature/ansible-role-feature/tasks/main.yml
---
# Assert that the devcontainer variant is compatible with this role
- name: Assert that _securedevcontainer_variant is in the _securedevcontainer_compatibility_list
  ansible.builtin.assert:
    that: _securedevcontainer_variant in _securedevcontainer_compatibility_list
    fail_msg: "_securedevcontainer_variant = '{{ _securedevcontainer_variant }}' is NOT in the _securedevcontainer_compatibility_list = '{{ _securedevcontainer_compatibility_list }}'."
    success_msg: "_securedevcontainer_variant = '{{ _securedevcontainer_variant }}' is in the _securedevcontainer_compatibility_list = '{{ _securedevcontainer_compatibility_list }}'."

# ---------------------------------------------------------------------------
# PARAMETER BRACKET — this role has NO defaults. Every value below must arrive
# as an extra-var from install.sh, so a missing one fails here, by name, before
# any work happens.
# ---------------------------------------------------------------------------
- name: Assert that the runner contract was satisfied
  ansible.builtin.assert:
    that:
      - _target_username is defined and _target_username | length > 0
      - _target_user_home is defined and _target_user_home | length > 0
      - _target_arch in ['amd64', 'arm64']
    fail_msg: >-
      This role must be invoked through /opt/bootstrap/run-feature.sh, which
      injects _target_username, _target_user_home and _target_arch.

- name: Assert that every required role parameter was supplied
  ansible.builtin.assert:
    that:
      - _npm_version is defined and _npm_version | length > 0
      - _npm_version is match('^\d+\.\d+\.\d+$')
    fail_msg: >-
      A required role parameter was not supplied. This role has NO defaults by
      design — install.sh must pass each one via -e, sourced from the matching
      option default in devcontainer-feature.json:
        _npm_version <- target_version

        target_version must look like X.Y.Z
    success_msg: "npm {{ _npm_version }}"

# npm update tasks
- name: Check current npm version
  ansible.builtin.command:
    cmd: "{{ _target_user_home }}/.local/share/nodejs/bin/npm --version"
  environment:
    HOME: "{{ _target_user_home }}"
    PATH: "{{ _target_user_home }}/.local/share/nodejs/bin:{{ _target_user_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
  failed_when: false
  register: _npm_current_version
  changed_when: false

- name: Display current npm version
  ansible.builtin.debug:
    msg: "Current npm version: {{ _npm_current_version.stdout | default('not installed') }}"

- name: Update npm to version {{ _npm_version }}
  ansible.builtin.command:
    cmd: "{{ _target_user_home }}/.local/share/nodejs/bin/npm install -g npm@{{ _npm_version }} --prefix {{ _target_user_home }}/.local/share/nodejs"
  environment:
    HOME: "{{ _target_user_home }}"
    PATH: "{{ _target_user_home }}/.local/share/nodejs/bin:{{ _target_user_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
  when: _npm_current_version.rc != 0
        or _npm_version not in _npm_current_version.stdout

- name: Get npm version after update
  ansible.builtin.command:
    cmd: "{{ _target_user_home }}/.local/share/nodejs/bin/npm --version"
  changed_when: false
  environment:
    HOME: "{{ _target_user_home }}"
    PATH: "{{ _target_user_home }}/.local/share/nodejs/bin:{{ _target_user_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
  register: _npm_version_result

- name: Assert that npm is installed at the correct version
  ansible.builtin.assert:
    that: "_npm_version in _npm_version_result.stdout"
    fail_msg: "Expected npm {{ _npm_version }}, got {{ _npm_version_result.stdout }}"
    success_msg: "npm {{ _npm_version_result.stdout }} installed successfully"
...
