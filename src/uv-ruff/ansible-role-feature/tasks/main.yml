# uv-ruff-feature/ansible-role-feature/tasks/main.yml
---
# Assert that the devcontainer variant is compatible with this role
- name: Assert that _securedevcontainer_variant is in the _securedevcontainer_compatibility_list
  ansible.builtin.assert:
    that: _securedevcontainer_variant in _securedevcontainer_compatibility_list
    fail_msg: "_securedevcontainer_variant = '{{ _securedevcontainer_variant }}' is NOT in the _securedevcontainer_compatibility_list = '{{ _securedevcontainer_compatibility_list }}'."
    success_msg: "_securedevcontainer_variant = '{{ _securedevcontainer_variant }}' is in the _securedevcontainer_compatibility_list = '{{ _securedevcontainer_compatibility_list }}'."

# ---------------------------------------------------------------------------
# PARAMETER BRACKET — this role has NO defaults. Every value below must arrive
# as an extra-var from install.sh, so a missing one fails here, by name, before
# any work happens.
# ---------------------------------------------------------------------------
- name: Assert that the runner contract was satisfied
  ansible.builtin.assert:
    that:
      - _target_username is defined and _target_username | length > 0
      - _target_user_home is defined and _target_user_home | length > 0
      - _target_arch in ['amd64', 'arm64']
    fail_msg: >-
      This role must be invoked through /opt/bootstrap/run-feature.sh, which
      injects _target_username, _target_user_home and _target_arch.

- name: Assert that every required role parameter was supplied
  ansible.builtin.assert:
    that:
      - _uv_version is defined and _uv_version | length > 0
      - _uv_checksum is defined
      - _ruff_version is defined and _ruff_version | length > 0
      - _uv_version is match('^\d+\.\d+\.\d+$')
      - _ruff_version is match('^\d+\.\d+\.\d+$')
      - _uv_checksum | length == 0 or _uv_checksum is match('^[0-9a-fA-F]{64}$')
    fail_msg: >-
      A required role parameter was not supplied. This role has NO defaults by
      design — install.sh must pass each one via -e, sourced from the matching
      option default in devcontainer-feature.json:
        _uv_version   <- target_uv_version    (mandatory, non-empty)
        _uv_checksum  <- target_uv_checksum   (may be empty; uses the pinned map)
        _ruff_version <- target_ruff_version  (mandatory, non-empty)

        target_uv_version and target_ruff_version must look like X.Y.Z
        target_uv_checksum, when not empty, must be a 64-character SHA256 hex digest
    success_msg: "uv {{ _uv_version }} + ruff {{ _ruff_version }} ({{ _target_arch }})"

# UV installation tasks
- name: Check if UV is already installed for target user
  ansible.builtin.command: "{{ _target_user_home }}/.local/bin/uv --version"
  failed_when: false
  register: _uv_version_result
  changed_when: false

- name: Create temporary download directory
  ansible.builtin.file:
    path: /tmp/uv-ruff-feature-install
    state: directory
    mode: '0755'
  when: _uv_version_result.rc != 0
        or _uv_version not in _uv_version_result.stdout

# A resolved-empty checksum means get_url would SKIP verification rather than
# fail it. Assert it before the download so an unpinned version/platform pair is
# a named error, not a silently unverified tarball (ADR-006).
- name: Assert that a checksum is available for uv {{ _uv_version }} ({{ _uv_platform }})
  ansible.builtin.assert:
    that: _uv_effective_checksum | length > 0
    fail_msg: >-
      No SHA256 is pinned for {{ _uv_tarball }}. Pass target_uv_checksum to
      install a version or platform that is not in the role's pinned map.
  when: _uv_version_result.rc != 0
        or _uv_version not in _uv_version_result.stdout

- name: Download UV binary tarball
  ansible.builtin.get_url:
    url: "{{ _uv_download_url }}"
    dest: "/tmp/uv-ruff-feature-install/{{ _uv_tarball }}"
    checksum: "sha256:{{ _uv_effective_checksum }}"
    timeout: 60
  when: _uv_version_result.rc != 0
        or _uv_version not in _uv_version_result.stdout

- name: Ensure ~/.local/bin directory exists
  ansible.builtin.file:
    path: "{{ _target_user_home }}/.local/bin"
    state: directory
    mode: '0755'
    owner: "{{ _target_username }}"
    group: "{{ _target_username }}"

- name: Extract UV binary (strip nested directory)
  ansible.builtin.command:
    cmd: "tar xzf /tmp/uv-ruff-feature-install/{{ _uv_tarball }} --strip-components=1 -C {{ _target_user_home }}/.local/bin/"
  when: _uv_version_result.rc != 0
        or _uv_version not in _uv_version_result.stdout

- name: Set ownership of uv and uvx binaries
  ansible.builtin.file:
    path: "{{ _target_user_home }}/.local/bin/{{ item }}"
    owner: "{{ _target_username }}"
    group: "{{ _target_username }}"
    mode: '0755'
  loop:
    - uv
    - uvx

- name: Remove temporary download directory
  ansible.builtin.file:
    path: /tmp/uv-ruff-feature-install
    state: absent

- name: Get UV version
  ansible.builtin.command:
    cmd: "{{ _target_user_home }}/.local/bin/uv --version"
  changed_when: false
  register: _uv_version_result

- name: Assert that UV is installed and accessible
  ansible.builtin.assert:
    that: "_uv_version in _uv_version_result.stdout"
    fail_msg: "Expected uv {{ _uv_version }}; uv reported: {{ _uv_version_result.stdout }}"
    success_msg: "{{ _uv_version_result.stdout }}"

# Ruff installation via uv tool install
- name: Check the currently installed Ruff version
  ansible.builtin.command:
    cmd: "{{ _target_user_home }}/.local/bin/ruff --version"
  environment:
    HOME: "{{ _target_user_home }}"
    PATH: "{{ _target_user_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
  failed_when: false
  changed_when: false
  register: _ruff_installed

# No --python pin. Ruff is a self-contained binary, so the interpreter uv builds
# its tool environment against is incidental -- but naming a version here forces
# uv to fetch THAT interpreter whether or not the container already has one.
# With the python feature on 3.13 and bootstrap on 3.13, a hardcoded 3.12 meant
# a third interpreter downloaded solely for ruff, carrying its own CVEs. Letting
# uv resolve reuses what is already present.
- name: Install Ruff {{ _ruff_version }} via uv tool install
  ansible.builtin.command:
    cmd: "{{ _target_user_home }}/.local/bin/uv tool install ruff=={{ _ruff_version }}"
  environment:
    HOME: "{{ _target_user_home }}"
    PATH: "{{ _target_user_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
  when: _ruff_installed.rc != 0 or _ruff_version not in (_ruff_installed.stdout | default(''))
  changed_when: true

- name: Get Ruff version
  ansible.builtin.command:
    cmd: "{{ _target_user_home }}/.local/bin/ruff --version"
  register: _ruff_version_result
  changed_when: false

- name: Assert that Ruff is installed and accessible
  ansible.builtin.assert:
    that: "_ruff_version in _ruff_version_result.stdout"
    fail_msg: "Expected ruff {{ _ruff_version }}; ruff reported: {{ _ruff_version_result.stdout }}"
    success_msg: "{{ _ruff_version_result.stdout }}"
...