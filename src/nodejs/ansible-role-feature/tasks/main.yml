# nodejs-feature/ansible-role-feature/tasks/main.yml
---
# Assert that the devcontainer variant is compatible with this role
- name: Assert that _securedevcontainer_variant is in the _securedevcontainer_compatibility_list
  ansible.builtin.assert:
    that: _securedevcontainer_variant in _securedevcontainer_compatibility_list
    fail_msg: "_securedevcontainer_variant = '{{ _securedevcontainer_variant }}' is NOT in the _securedevcontainer_compatibility_list = '{{ _securedevcontainer_compatibility_list }}'."
    success_msg: "_securedevcontainer_variant = '{{ _securedevcontainer_variant }}' is in the _securedevcontainer_compatibility_list = '{{ _securedevcontainer_compatibility_list }}'."

# ---------------------------------------------------------------------------
# PARAMETER BRACKET — this role has NO defaults. Every value below must arrive
# as an extra-var from install.sh, so a missing one fails here, by name, before
# any work happens.
# ---------------------------------------------------------------------------
- name: Assert that the runner contract was satisfied
  ansible.builtin.assert:
    that:
      - _target_username is defined and _target_username | length > 0
      - _target_user_home is defined and _target_user_home | length > 0
      - _target_arch in ['amd64', 'arm64']
    fail_msg: >-
      This role must be invoked through /opt/bootstrap/run-feature.sh, which
      injects _target_username, _target_user_home and _target_arch.

- name: Assert that every required role parameter was supplied
  ansible.builtin.assert:
    that:
      - _nodejs_version is defined and _nodejs_version | length > 0
      - _nodejs_checksum is defined
      - _nodejs_version is match('^\d+\.\d+\.\d+$')
      - _nodejs_checksum | length == 0 or _nodejs_checksum is match('^[0-9a-fA-F]{64}$')
      - _nodejs_npm_version is defined and _nodejs_npm_version | length > 0
      - _nodejs_npm_version is match('^\d+\.\d+\.\d+$')
    fail_msg: >-
      A required role parameter was not supplied. This role has NO defaults by
      design — install.sh must pass each one via -e, sourced from the matching
      option default in devcontainer-feature.json:
        _nodejs_version  <- target_version   (mandatory, non-empty)
        _nodejs_checksum <- target_checksum  (may be empty; resolved from
                                              SHASUMS256.txt)
        _nodejs_npm_version <- npm_version   (mandatory, non-empty)

        target_version and npm_version must look like X.Y.Z
        target_checksum, when not empty, must be a 64-character SHA256 hex digest
    success_msg: "nodejs {{ _nodejs_version }} ({{ _nodejs_arch }}), npm {{ _nodejs_npm_version }}"

# Node.js installation tasks
- name: Check if Node.js is already installed
  ansible.builtin.command: "{{ _target_user_home }}/.local/share/nodejs/bin/node --version"
  failed_when: false
  register: _nodejs_version_result
  changed_when: false

- name: Create temporary download directory
  ansible.builtin.file:
    path: /tmp/nodejs-feature-install
    state: directory
    mode: '0755'
  when: _nodejs_version_result.rc != 0
        or _nodejs_version not in _nodejs_version_result.stdout

- name: Download Node.js checksums file
  ansible.builtin.get_url:
    url: "{{ _nodejs_checksums_download_url }}"
    dest: "/tmp/nodejs-feature-install/SHASUMS256.txt"
    timeout: 60
  when:
    - _nodejs_version_result.rc != 0 or _nodejs_version not in _nodejs_version_result.stdout
    - _nodejs_checksum | default('', true) | length == 0

- name: Read checksums file
  ansible.builtin.slurp:
    src: "/tmp/nodejs-feature-install/SHASUMS256.txt"
  register: _nodejs_checksums_file_content
  when:
    - _nodejs_version_result.rc != 0 or _nodejs_version not in _nodejs_version_result.stdout
    - _nodejs_checksum | default('', true) | length == 0

- name: Find the checksum for {{ _nodejs_tarball }}
  ansible.builtin.set_fact:
    _nodejs_effective_checksum: "{{ item.split()[0] }}"
  when:
    - _nodejs_version_result.rc != 0 or _nodejs_version not in _nodejs_version_result.stdout
    - _nodejs_checksum | default('', true) | length == 0
    - _nodejs_tarball in item
  loop: "{{ _nodejs_checksums_file_content.content | b64decode | split('\n') | reject('eq', '') | list }}"

- name: Display the checksum
  ansible.builtin.debug:
    msg: "Checksum for {{ _nodejs_tarball }} is: {{ _nodejs_effective_checksum }}"

# A resolved-empty checksum means get_url would SKIP verification rather than
# fail it. Assert it before the download so a missing SHASUMS256.txt entry is a
# named error, not a silently unverified tarball (ADR-006).
- name: Assert that a checksum is available for Node.js {{ _nodejs_version }} ({{ _nodejs_arch }})
  ansible.builtin.assert:
    that: _nodejs_effective_checksum | length > 0
    fail_msg: >-
      No SHA256 resolved for {{ _nodejs_tarball }}. It was not found in
      SHASUMS256.txt, and no target_checksum was supplied.
  when: _nodejs_version_result.rc != 0
        or _nodejs_version not in _nodejs_version_result.stdout

- name: Download Node.js tarball
  ansible.builtin.get_url:
    url: "{{ _nodejs_download_url }}"
    dest: "/tmp/nodejs-feature-install/{{ _nodejs_tarball }}"
    checksum: "sha256:{{ _nodejs_effective_checksum }}"
    timeout: 60
  when: _nodejs_version_result.rc != 0
        or _nodejs_version not in _nodejs_version_result.stdout

- name: Ensure ~/.local/share/nodejs directory exists
  ansible.builtin.file:
    path: "{{ _target_user_home }}/.local/share/nodejs"
    state: directory
    mode: '0755'
    owner: "{{ _target_username }}"
    group: "{{ _target_username }}"

- name: Extract Node.js tarball (strip nested directory)
  ansible.builtin.command:
    cmd: "tar xzf /tmp/nodejs-feature-install/{{ _nodejs_tarball }} --strip-components=1 -C {{ _target_user_home }}/.local/share/nodejs/"
  when: _nodejs_version_result.rc != 0
        or _nodejs_version not in _nodejs_version_result.stdout

- name: Recursively change ownership of Node.js installation
  ansible.builtin.file:
    path: "{{ _target_user_home }}/.local/share/nodejs"
    owner: "{{ _target_username }}"
    group: "{{ _target_username }}"
    recurse: true

- name: Remove temporary download directory
  ansible.builtin.file:
    path: /tmp/nodejs-feature-install
    state: absent

- name: Get Node.js version
  ansible.builtin.command:
    cmd: "{{ _target_user_home }}/.local/share/nodejs/bin/node --version"
  changed_when: false
  register: _nodejs_version_result

- name: Assert that Node.js is installed and accessible
  ansible.builtin.assert:
    that: "'v' + _nodejs_version in _nodejs_version_result.stdout"
    fail_msg: "{{ _nodejs_version_result.stdout }}"
    success_msg: "{{ _nodejs_version_result.stdout }}"

# REPLACE THE BUNDLED npm. Every Node.js tarball ships its own npm, and that copy
# lags: Node.js 22.23.4 bundles npm 10.9.9, whose vendored dependencies carry
# published advisories. Leaving it to an optional npm feature meant any image
# without that feature kept the vulnerable copy, and a scanner flags it whether
# or not anyone runs it. So the runtime that brings npm in also replaces it.
#
# Compared exactly, not with `in`: "2.2.1" is a substring of "12.2.1".
# Re-extracting the tarball (a Node.js version change) restores the bundled npm,
# which this check then sees and replaces again.
- name: Check the npm version Node.js currently provides
  ansible.builtin.command:
    cmd: "{{ _target_user_home }}/.local/share/nodejs/bin/npm --version"
  environment: "{{ _nodejs_npm_environment }}"
  failed_when: false
  changed_when: false
  register: _nodejs_npm_current

# npm verifies the tarball against the registry's sha512 integrity before it
# installs it. The cache goes to /tmp so it does not ship in the image layer.
- name: Replace the bundled npm with npm {{ _nodejs_npm_version }}
  ansible.builtin.command:
    cmd: >-
      {{ _target_user_home }}/.local/share/nodejs/bin/npm install -g
      npm@{{ _nodejs_npm_version }}
      --prefix {{ _target_user_home }}/.local/share/nodejs
      --no-audit --no-fund
  environment: "{{ _nodejs_npm_environment }}"
  when: _nodejs_npm_current.rc != 0
        or (_nodejs_npm_current.stdout | trim) != _nodejs_npm_version

- name: Remove the npm install cache
  ansible.builtin.file:
    path: "{{ _nodejs_npm_environment.npm_config_cache }}"
    state: absent

- name: Get npm version
  ansible.builtin.command:
    cmd: "{{ _target_user_home }}/.local/share/nodejs/bin/npm --version"
  environment: "{{ _nodejs_npm_environment }}"
  changed_when: false
  failed_when: false
  register: _nodejs_npm_result

- name: Assert that npm {{ _nodejs_npm_version }} is installed and runs on this Node.js
  ansible.builtin.assert:
    that:
      - _nodejs_npm_result.rc == 0
      - (_nodejs_npm_result.stdout | trim) == _nodejs_npm_version
    fail_msg: >-
      Expected npm {{ _nodejs_npm_version }} on {{ _nodejs_version_result.stdout }};
      got rc={{ _nodejs_npm_result.rc }}:
      {{ _nodejs_npm_result.stdout }} {{ _nodejs_npm_result.stderr }}.
      npm 12 requires Node.js ^22.22.2 || ^24.15.0 || >=26; with an older
      Node.js, set npm_version to a 10.x release.
    success_msg: "npm {{ _nodejs_npm_result.stdout | trim }}"

# ON PATH WITHOUT A containerEnv ENTRY. This feature used to announce its
# directory through containerEnv, which the devcontainer CLI emits as a literal
# Dockerfile ENV -- no substitution is available there, so the path had to be
# written as /home/dev and was wrong for any other account. ~/.local/bin is
# already on PATH in every base image here, so a link into it needs no variable
# and is correct whoever the user is.
# npm and npx are themselves symlinks into ../lib/node_modules; a second link resolves through to the same real file, and npm locates its lib dir from that real path.
- name: Ensure ~/.local/bin exists
  ansible.builtin.file:
    path: "{{ _target_user_home }}/.local/bin"
    state: directory
    mode: '0755'

- name: Link the binaries into ~/.local/bin so no PATH entry is needed
  ansible.builtin.file:
    src: "{{ _target_user_home }}/.local/share/nodejs/bin/{{ item }}"
    dest: "{{ _target_user_home }}/.local/bin/{{ item }}"
    state: link
    force: true
  loop: ['node', 'npm', 'npx']
...
