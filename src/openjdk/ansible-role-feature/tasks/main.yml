# openjdk-feature/ansible-role-feature/tasks/main.yml
---
# Assert that the devcontainer variant is compatible with this role
- name: Assert that _securedevcontainer_variant is in the _securedevcontainer_compatibility_list
  ansible.builtin.assert:
    that: _securedevcontainer_variant in _securedevcontainer_compatibility_list
    fail_msg: "_securedevcontainer_variant = '{{ _securedevcontainer_variant }}' is NOT in the _securedevcontainer_compatibility_list = '{{ _securedevcontainer_compatibility_list }}'."
    success_msg: "_securedevcontainer_variant = '{{ _securedevcontainer_variant }}' is in the _securedevcontainer_compatibility_list = '{{ _securedevcontainer_compatibility_list }}'."

- name: Extract the UBI version number from _securedevcontainer_variant
  ansible.builtin.set_fact:
    _securedevcontainer_ubi_version: "{{ _securedevcontainer_variant | regex_replace('^.*?(\\d+)$', '\\1') }}"

- name: Display _securedevcontainer_ubi_version
  ansible.builtin.debug:
    msg: "UBI version number: {{ _securedevcontainer_ubi_version }}"

# Install system dependencies
- name: Configure UBI-{{ _securedevcontainer_ubi_version }}-BaseOS repository
  ansible.builtin.yum_repository:
    name: ubi-{{ _securedevcontainer_ubi_version }}-baseos-rpms
    description: Red Hat Universal Base Image {{ _securedevcontainer_ubi_version }} (RPMs) - BaseOS
    baseurl: https://cdn-ubi.redhat.com/content/public/ubi/dist/ubi{{ _securedevcontainer_ubi_version }}/{{ _securedevcontainer_ubi_version }}/$basearch/baseos/os
    enabled: yes
    gpgkey: file:///etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release
    gpgcheck: true

- name: Install system dependencies (libicu, openssl-libs)
  ansible.builtin.package:
    name:
      - libicu
      - openssl-libs
    state: present

# OpenJDK installation tasks
- name: Check if OpenJDK is already installed
  ansible.builtin.command: "{{ _target_user_home }}/.local/share/java/bin/java -version"
  ignore_errors: true
  register: _java_version_result
  changed_when: false

- name: Create temporary download directory
  ansible.builtin.file:
    path: /tmp/openjdk-feature-install
    state: directory
    mode: '0755'
  when: _java_version_result is failed

- name: Download OpenJDK tarball
  ansible.builtin.get_url:
    url: "{{ _openjdk_download_url }}"
    dest: "/tmp/openjdk-feature-install/{{ _openjdk_tarball }}"
    checksum: "{{ 'sha256:' + _openjdk_checksum if _openjdk_checksum | default('', true) | length > 0 else omit }}"
  when: _java_version_result is failed

- name: Ensure ~/.local/share/java directory exists
  ansible.builtin.file:
    path: "{{ _target_user_home }}/.local/share/java"
    state: directory
    mode: '0755'
    owner: "{{ _target_username }}"
    group: "{{ _target_username }}"

- name: Extract OpenJDK tarball (strip nested directory)
  ansible.builtin.command:
    cmd: "tar xzf /tmp/openjdk-feature-install/{{ _openjdk_tarball }} --strip-components=1 -C {{ _target_user_home }}/.local/share/java/"
  when: _java_version_result is failed

- name: Recursively change ownership of OpenJDK installation
  ansible.builtin.file:
    path: "{{ _target_user_home }}/.local/share/java"
    owner: "{{ _target_username }}"
    group: "{{ _target_username }}"
    recurse: true

- name: Remove temporary download directory
  ansible.builtin.file:
    path: /tmp/openjdk-feature-install
    state: absent

- name: Get Java version
  ansible.builtin.command:
    cmd: "{{ _target_user_home }}/.local/share/java/bin/java -version"
  register: _java_version_result

- name: Assert that Java is installed and accessible
  ansible.builtin.assert:
    that: "'openjdk version' in _java_version_result.stderr or 'openjdk version' in _java_version_result.stdout"
    fail_msg: "stdout: {{ _java_version_result.stdout }} stderr: {{ _java_version_result.stderr }}"
    success_msg: "{{ _java_version_result.stderr }}"

- name: Ensure ~/.local/bin directory exists
  ansible.builtin.file:
    path: "{{ _target_user_home }}/.local/bin"
    state: directory
    mode: '0755'
    owner: "{{ _target_username }}"
    group: "{{ _target_username }}"

- name: Create symlinks in ~/.local/bin for Java binaries
  ansible.builtin.file:
    src: "{{ _target_user_home }}/.local/share/java/bin/{{ item }}"
    dest: "{{ _target_user_home }}/.local/bin/{{ item }}"
    state: link
    owner: "{{ _target_username }}"
    group: "{{ _target_username }}"
  loop:
    - java
    - javac
    - jar

# Cleanup
- name: Unset _securedevcontainer_ubi_version
  ansible.builtin.set_fact:
    _securedevcontainer_ubi_version: null
...
