# openjdk-feature/ansible-role-feature/vars/main.yml
---
_securedevcontainer_compatibility_list:
  - ubi9
  - ubi10
  - fedora43

# ---------------------------------------------------------------------------
# DERIVED VALUES AND ROLE CONSTANTS
#
# Adoptium names its assets x64 / aarch64 — note aarch64, not arm64 — so
# _target_arch (amd64 | arm64) is translated rather than used directly.
# Never mask it with `| default(...)`.
# ---------------------------------------------------------------------------
_openjdk_platform: linux
_openjdk_arch: "{{ 'aarch64' if _target_arch == 'arm64' else 'x64' }}"
# URL-safe version: replace + with %2B
_openjdk_version_urlencoded: "{{ _openjdk_version | regex_replace('\\+', '%2B') }}"
# Underscore version for tarball name: replace + with _
_openjdk_version_underscore: "{{ _openjdk_version | regex_replace('\\+', '_') }}"
# Example: OpenJDK21U-jdk_x64_linux_hotspot_21.0.6_7.tar.gz
_openjdk_tarball: "OpenJDK{{ _openjdk_major_version }}U-jdk_{{ _openjdk_arch }}_{{ _openjdk_platform }}_hotspot_{{ _openjdk_version_underscore }}.tar.gz"
# Example: https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.6%2B7/OpenJDK21U-jdk_x64_linux_hotspot_21.0.6_7.tar.gz
_openjdk_download_url: "https://github.com/adoptium/temurin{{ _openjdk_major_version }}-binaries/releases/download/jdk-{{ _openjdk_version_urlencoded }}/{{ _openjdk_tarball }}"

# SHA256 digests pinned per version, per architecture, from the per-asset
# .sha256.txt files Adoptium publishes. The role previously passed `else omit`
# to get_url, which skipped verification entirely whenever target_checksum was
# empty — that is, always, by default.
_openjdk_pinned_checksums:
  "21.0.6+7":
    x64: "a2650fba422283fbed20d936ce5d2a52906a5414ec17b2f7676dddb87201dbae"
    aarch64: "04fe1273f624187d927f1b466e8cdb630d70786db07bee7599bfa5153060afd3"

_openjdk_effective_checksum: >-
  {{ _openjdk_checksum if _openjdk_checksum | length > 0
     else _openjdk_pinned_checksums.get(_openjdk_version, {}).get(_openjdk_arch, '') }}
...
