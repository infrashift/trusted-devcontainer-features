# Ansible Playbook
# yq-feature/activate-feature.yml
---
- name: Activate DevContainer Feature - yq
  hosts: ubi
  become: false
  gather_facts: false

  roles:
  - role: ansible-role-feature
    vars:
      _securedevcontainer_variant: "{{ securedevcontainer_variant }}"
      _yq_version: "{{ yq_version }}"
      _yq_checksum: "{{ yq_checksum }}"
      _target_username: "{{ remote_user }}"
      _target_user_home: "{{ remote_user_home }}"
...
