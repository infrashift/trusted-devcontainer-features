# python-feature/ansible-role-feature/tasks/main.yml
---
# Assert that the devcontainer variant is compatible with this role
- name: Assert that _securedevcontainer_variant is in the _securedevcontainer_compatibility_list
  ansible.builtin.assert:
    that: _securedevcontainer_variant in _securedevcontainer_compatibility_list
    fail_msg: "_securedevcontainer_variant = '{{ _securedevcontainer_variant }}' is NOT in the _securedevcontainer_compatibility_list = '{{ _securedevcontainer_compatibility_list }}'."

# ---------------------------------------------------------------------------
# PARAMETER BRACKET — this role has NO defaults. Every value below must arrive
# as an extra-var from install.sh, so a missing one fails here, by name, before
# any work happens.
# ---------------------------------------------------------------------------
- name: Assert that the runner contract was satisfied
  ansible.builtin.assert:
    that:
      - _target_username is defined and _target_username | length > 0
      - _target_user_home is defined and _target_user_home | length > 0
      - _target_arch in ['amd64', 'arm64']
    fail_msg: >-
      This role must be invoked through /opt/bootstrap/run-feature.sh, which
      injects _target_username, _target_user_home and _target_arch.

- name: Assert that every required role parameter was supplied
  ansible.builtin.assert:
    that:
      - _python_version is defined and _python_version | length > 0
      - _python_version is match('^\d+\.\d+$')
    fail_msg: >-
      A required role parameter was not supplied. This role has NO defaults by
      design — install.sh must pass it via -e, sourced from the matching option
      default in devcontainer-feature.json:
        _python_version <- target_version

        target_version must look like X.Y (no patch component)
    success_msg: "python {{ _python_version }} ({{ _target_arch }})"

# Python installation tasks
- name: Determine which uv binary to use
  ansible.builtin.stat:
    path: "{{ _target_user_home }}/.local/bin/uv"
  register: _uv_bin_stat

- name: Set uv binary path fact
  ansible.builtin.set_fact:
    _uv_bin: "{{ _uv_bin_stat.stat.path if _uv_bin_stat.stat.exists else '/usr/local/bin/uv' }}"

- name: Ensure ~/.local/bin directory exists
  ansible.builtin.file:
    path: "{{ _target_user_home }}/.local/bin"
    state: directory
    mode: '0755'
    owner: "{{ _target_username }}"
    group: "{{ _target_username }}"

# ALWAYS run the install, even when `uv python find' already succeeds. Finding
# an interpreter is not the same as having installed one: `uv tool install'
# (uv-ruff's ruff, which this feature installs after) downloads a managed
# CPython as a tool dependency and creates NO executable for it. `find' then
# reports the version present, and a skipped install leaves the image with no
# ~/.local/bin/python{{ _python_version }} at all -- which is what a
# python + uv-ruff image shipped once the two defaults met at 3.14. The install
# is idempotent: on an interpreter that is already there it only adds the
# missing executable ("Installed Python ..."), and with nothing missing it
# says "is already installed" and changes nothing.
- name: Install Python {{ _python_version }} via uv (and its executable)
  ansible.builtin.command:
    cmd: "{{ _uv_bin }} python install {{ _python_version }}"
  environment:
    HOME: "{{ _target_user_home }}"
    PATH: "{{ _target_user_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
  register: _python_install_log
  changed_when: _python_install_log.stderr is search('Installed Python')

- name: Verify Python {{ _python_version }} is installed
  ansible.builtin.command:
    cmd: "{{ _uv_bin }} python find {{ _python_version }}"
  environment:
    HOME: "{{ _target_user_home }}"
    PATH: "{{ _target_user_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
  register: _python_verify_result
  changed_when: false

- name: Assert that Python is installed and accessible
  ansible.builtin.assert:
    that:
      - _python_verify_result.rc == 0
      - _python_verify_result.stdout is search('cpython-' ~ _python_version ~ '[.-]')
    fail_msg: "Python {{ _python_version }} could not be found after installation. Error: {{ _python_verify_result.stderr }}"
    success_msg: "Python {{ _python_version }} installed and verified."

# The check above is the one that let the missing executable through: `find'
# answers from uv's own registry, and the interpreter WAS registered. What a
# developer runs is the executable on the PATH, so that is what is asserted.
- name: Stat the python{{ _python_version }} executable
  ansible.builtin.stat:
    path: "{{ _target_user_home }}/.local/bin/python{{ _python_version }}"
  register: _python_executable

- name: Assert that python{{ _python_version }} is on the user's PATH
  ansible.builtin.assert:
    that:
      - _python_executable.stat.exists
      - _python_executable.stat.executable | default(false)
    fail_msg: >-
      uv has Python {{ _python_version }} but {{ _target_user_home }}/.local/bin/python{{ _python_version }}
      does not exist: the interpreter is present and cannot be run by name.
    success_msg: "{{ _target_user_home }}/.local/bin/python{{ _python_version }}"
