# Ansible Playbook
# pnpm-feature/activate-feature.yml
---
- name: Activate DevContainer Feature - pnpm
  hosts: ubi
  become: false
  gather_facts: false

  roles:
  - role: ansible-role-feature
    vars:
      _securedevcontainer_variant: "{{ securedevcontainer_variant }}"
      _pnpm_version: "{{ pnpm_version }}"
      _pnpm_checksum: "{{ pnpm_checksum }}"
      _target_username: "{{ remote_user }}"
      _target_user_home: "{{ remote_user_home }}"
...
