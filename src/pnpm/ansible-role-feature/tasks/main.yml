# pnpm-feature/ansible-role-feature/tasks/main.yml
---
- name: Extract the UBI version number
  ansible.builtin.set_fact:
    _securedevcontainer_ubi_version: "{{ _securedevcontainer_variant | regex_replace('^.*?(\\d+)$', '\\1') }}"

# pnpm installation tasks
- name: Check if pnpm is already installed
  ansible.builtin.command: "{{ _target_user_home }}/.local/bin/pnpm --version"
  ignore_errors: true
  register: _pnpm_version_result
  changed_when: false

- name: Ensure ~/.local/bin directory exists
  ansible.builtin.file:
    path: "{{ _target_user_home }}/.local/bin"
    state: directory
    mode: '0755'
    owner: "{{ _target_username }}"
    group: "{{ _target_username }}"

- name: Download pnpm standalone binary
  ansible.builtin.get_url:
    # This uses the official pnpm redirector for the latest standalone binary
    url: "https://github.com/pnpm/pnpm/releases/latest/download/pnpm-linux-x64"
    dest: "{{ _target_user_home }}/.local/bin/pnpm"
    owner: "{{ _target_username }}"
    group: "{{ _target_username }}"
    mode: '0755'
  when: _pnpm_version_result is failed

- name: Get pnpm version
  ansible.builtin.command:
    cmd: "{{ _target_user_home }}/.local/bin/pnpm --version"
  register: _pnpm_check
  changed_when: false

- name: Assert that pnpm is installed
  ansible.builtin.assert:
    that: _pnpm_check.rc == 0
    fail_msg: "pnpm failed to install."

# Cleanup
- name: Unset _securedevcontainer_ubi_version
  ansible.builtin.set_fact:
    _securedevcontainer_ubi_version: null
...