# bun-feature/ansible-role-feature/tasks/main.yml
---
# Assert that the devcontainer variant is compatible with this role
- name: Assert that _securedevcontainer_variant is in the _securedevcontainer_compatibility_list
  ansible.builtin.assert:
    that: _securedevcontainer_variant in _securedevcontainer_compatibility_list
    fail_msg: "_securedevcontainer_variant = '{{ _securedevcontainer_variant }}' is NOT in the _securedevcontainer_compatibility_list = '{{ _securedevcontainer_compatibility_list }}'."
    success_msg: "_securedevcontainer_variant = '{{ _securedevcontainer_variant }}' is in the _securedevcontainer_compatibility_list = '{{ _securedevcontainer_compatibility_list }}'."

# ---------------------------------------------------------------------------
# PARAMETER BRACKET — this role has NO defaults. Every value below must arrive
# as an extra-var from install.sh, so a missing one fails here, by name, before
# any work happens.
# ---------------------------------------------------------------------------
- name: Assert that the runner contract was satisfied
  ansible.builtin.assert:
    that:
      - _target_username is defined and _target_username | length > 0
      - _target_user_home is defined and _target_user_home | length > 0
      - _target_arch in ['amd64', 'arm64']
    fail_msg: >-
      This role must be invoked through /opt/bootstrap/run-feature.sh, which
      injects _target_username, _target_user_home and _target_arch.

- name: Assert that every required role parameter was supplied
  ansible.builtin.assert:
    that:
      - _bun_version is defined and _bun_version | length > 0
      - _bun_checksum is defined
      - _bun_version is match('^\d+\.\d+\.\d+$')
      - _bun_checksum | length == 0 or _bun_checksum is match('^[0-9a-fA-F]{64}$')
    fail_msg: >-
      A required role parameter was not supplied. This role has NO defaults by
      design — install.sh must pass each one via -e, sourced from the matching
      option default in devcontainer-feature.json:
        _bun_version  <- target_version   (mandatory, non-empty)
        _bun_checksum <- target_checksum  (may be empty; uses the pinned map)

        target_version must look like X.Y.Z
        target_checksum, when not empty, must be a 64-character SHA256 hex digest
    success_msg: "bun {{ _bun_version }} ({{ _bun_arch }})"

# unzip now come from the template base image rather than being installed
# here. This keeps the feature entirely userland, so it runs as the target
# user and needs no privileged lane.

# Bun installation tasks
- name: Check if Bun is already installed
  ansible.builtin.command: "{{ _target_user_home }}/.local/bin/bun --version"
  failed_when: false
  register: _bun_version_result
  changed_when: false

- name: Create temporary download directory
  ansible.builtin.file:
    path: /tmp/bun-feature-install
    state: directory
    mode: '0755'
  when: _bun_version_result.rc != 0
        or _bun_version not in _bun_version_result.stdout

# A resolved-empty checksum means get_url would SKIP verification rather than
# fail it. Assert it before the download so an unpinned version/arch pair is a
# named error, not a silently unverified download (ADR-006).
- name: Assert that a checksum is available for Bun {{ _bun_version }} ({{ _bun_arch }})
  ansible.builtin.assert:
    that: _bun_effective_checksum | length > 0
    fail_msg: >-
      No SHA256 is pinned for {{ _bun_zipfile }} on {{ _bun_arch }}. Pass
      target_checksum to install a version or architecture that is not in the
      role's pinned map.
  when: _bun_version_result.rc != 0
        or _bun_version not in _bun_version_result.stdout

- name: Download Bun zip file
  ansible.builtin.get_url:
    url: "{{ _bun_download_url }}"
    dest: "/tmp/bun-feature-install/{{ _bun_zipfile }}"
    checksum: "sha256:{{ _bun_effective_checksum }}"
    timeout: 60
  when: _bun_version_result.rc != 0
        or _bun_version not in _bun_version_result.stdout

- name: Ensure ~/.local/bin directory exists
  ansible.builtin.file:
    path: "{{ _target_user_home }}/.local/bin"
    state: directory
    mode: '0755'
    owner: "{{ _target_username }}"
    group: "{{ _target_username }}"

- name: Extract Bun zip to temporary directory
  ansible.builtin.unarchive:
    src: "/tmp/bun-feature-install/{{ _bun_zipfile }}"
    dest: /tmp/bun-feature-install
    copy: no
  when: _bun_version_result.rc != 0
        or _bun_version not in _bun_version_result.stdout

- name: Copy bun binary to ~/.local/bin
  ansible.builtin.copy:
    src: "/tmp/bun-feature-install/bun-{{ _bun_platform }}-{{ _bun_arch }}/bun"
    dest: "{{ _target_user_home }}/.local/bin/bun"
    remote_src: yes
    owner: "{{ _target_username }}"
    group: "{{ _target_username }}"
    mode: '0755'
  when: _bun_version_result.rc != 0
        or _bun_version not in _bun_version_result.stdout

- name: Remove temporary download directory
  ansible.builtin.file:
    path: /tmp/bun-feature-install
    state: absent

- name: Get Bun version
  ansible.builtin.command:
    cmd: "{{ _target_user_home }}/.local/bin/bun --version"
  changed_when: false
  register: _bun_version_result

- name: Assert that Bun is installed and accessible
  ansible.builtin.assert:
    that: "_bun_version in _bun_version_result.stdout"
    fail_msg: "{{ _bun_version_result.stdout }}"
    success_msg: "Bun {{ _bun_version_result.stdout }} installed successfully"

# Cleanup
...
