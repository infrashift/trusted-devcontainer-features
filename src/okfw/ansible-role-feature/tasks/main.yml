# okfw-feature/ansible-role-feature/tasks/main.yml
---
# The variant is detected once, at bootstrap install time, from /etc/os-release
# and published as a group var in /opt/bootstrap/inventory.yml.
- name: Assert that _securedevcontainer_variant is in the _securedevcontainer_compatibility_list
  ansible.builtin.assert:
    that: _securedevcontainer_variant in _securedevcontainer_compatibility_list
    fail_msg: "_securedevcontainer_variant = '{{ _securedevcontainer_variant }}' is NOT in the _securedevcontainer_compatibility_list = '{{ _securedevcontainer_compatibility_list }}'."

# ---------------------------------------------------------------------------
# PARAMETER BRACKET — this role has NO defaults. Every value below must arrive
# as an extra-var from install.sh, so a missing one fails here, by name, before
# any work happens.
# ---------------------------------------------------------------------------
- name: Assert that the runner contract was satisfied
  ansible.builtin.assert:
    that:
      - _target_username is defined and _target_username | length > 0
      - _target_user_home is defined and _target_user_home | length > 0
      - _target_arch in ['amd64', 'arm64']
    fail_msg: >-
      This role must be invoked through /opt/bootstrap/run-feature.sh, which
      injects _target_username, _target_user_home and _target_arch.

- name: Assert that every required role parameter was supplied
  ansible.builtin.assert:
    that:
      - _okfw_version is defined and _okfw_version | length > 0
      - _okfw_checksum is defined
      - _okfw_version is match('^\d+\.\d+\.\d+$')
      - _okfw_checksum | length == 0 or _okfw_checksum is match('^[0-9a-fA-F]{64}$')
    fail_msg: >-
      A required role parameter was not supplied. This role has NO defaults by
      design — install.sh must pass each one via -e, sourced from the matching
      option default in devcontainer-feature.json:
        _okfw_version  <- target_version   (mandatory, non-empty)
        _okfw_checksum <- target_checksum  (may be empty; uses the pinned map)

        target_version must look like X.Y.Z (no leading v)
        target_checksum, when not empty, must be a 64-character SHA256 hex digest
    success_msg: "okfw {{ _okfw_version }} ({{ _okfw_arch }})"

- name: Check the currently installed okfw version
  ansible.builtin.command: "{{ _target_user_home }}/.local/bin/okfw --version"
  register: _okfw_installed
  failed_when: false
  changed_when: false

# `okfw version v2026.10.2`: match the whole token so 2026.10.2 is not
# satisfied by v2026.10.21.
- name: Determine whether okfw {{ _okfw_version }} needs installing
  ansible.builtin.set_fact:
    _okfw_install_required: >-
      {{ _okfw_installed.rc != 0
         or (_okfw_tag not in ((_okfw_installed.stdout | default('')).split())) }}

- name: Assert that a checksum is available for okfw {{ _okfw_version }} ({{ _okfw_arch }})
  ansible.builtin.assert:
    that: _okfw_effective_checksum | length > 0
    fail_msg: >-
      No SHA256 is pinned for okfw {{ _okfw_version }} on {{ _okfw_arch }}.
      Pass target_checksum (from the release's signed SHA256SUMS) to install a
      version other than the default.
  when: _okfw_install_required | bool

- name: Create the temporary download directory
  ansible.builtin.file:
    path: "{{ _okfw_tmp_dir }}"
    state: directory
    mode: '0755'
  when: _okfw_install_required | bool

# No checksum: a signature bundle is verified by the signature check below,
# against the pinned key. A tampered or substituted bundle fails that check, so
# a checksum would add a second pin per version and arch, and no protection.
# check-role-contract.sh exempts tasks named "signature bundle" for this reason.
- name: Download the okfw signature bundle
  ansible.builtin.get_url:
    url: "{{ _okfw_bundle_url }}"
    dest: "{{ _okfw_tmp_dir }}/{{ _okfw_bundle }}"
    mode: '0644'
    timeout: 60
  when: _okfw_install_required | bool

# GATE 1 — checksum. get_url verifies the download in the same step.
- name: Download the okfw release tarball
  ansible.builtin.get_url:
    url: "{{ _okfw_download_url }}"
    dest: "{{ _okfw_tmp_dir }}/{{ _okfw_tarball }}"
    mode: '0644'
    checksum: "sha256:{{ _okfw_effective_checksum }}"
    timeout: 60
  when: _okfw_install_required | bool

# GATE 2 — signature. The release key signed this exact tarball. Runs before
# anything is extracted, so a failure leaves the target untouched.
- name: Verify the cosign signature of {{ _okfw_tarball }}
  okfw_verify_blob:
    path: "{{ _okfw_tmp_dir }}/{{ _okfw_tarball }}"
    bundle: "{{ _okfw_tmp_dir }}/{{ _okfw_bundle }}"
    public_key: "{{ _okfw_cosign_public_key }}"
  register: _okfw_signature
  when: _okfw_install_required | bool

- name: Ensure ~/.local/bin exists
  ansible.builtin.file:
    path: "{{ _target_user_home }}/.local/bin"
    state: directory
    mode: '0755'

- name: Extract the okfw binary to ~/.local/bin
  ansible.builtin.unarchive:
    src: "{{ _okfw_tmp_dir }}/{{ _okfw_tarball }}"
    dest: "{{ _target_user_home }}/.local/bin"
    remote_src: true
    mode: '0755'
    extra_opts:
      - --strip-components=1
      - "{{ _okfw_basename }}/okfw"
  when: _okfw_install_required | bool

- name: Remove the temporary download directory
  ansible.builtin.file:
    path: "{{ _okfw_tmp_dir }}"
    state: absent

- name: Verify the installed okfw version
  ansible.builtin.command: "{{ _target_user_home }}/.local/bin/okfw --version"
  register: _okfw_verify
  changed_when: false

- name: Assert that okfw {{ _okfw_version }} is installed and accessible
  ansible.builtin.assert:
    that: _okfw_tag in _okfw_verify.stdout.split()
    fail_msg: "Expected okfw {{ _okfw_tag }}; installed okfw reported: {{ _okfw_verify.stdout }}"
    success_msg: "{{ _okfw_verify.stdout }}"

# The MCP server is the same binary. Prove it starts and answers the MCP
# handshake; it closes when stdin does. /tmp holds no wiki, and initialize does
# not need one.
- name: Check that the okfw MCP server answers an initialize request
  ansible.builtin.command:
    argv: [timeout, "15", "{{ _target_user_home }}/.local/bin/okfw", mcp]
    chdir: /tmp
    stdin: >-
      {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"okfw-feature","version":"1"}}}
  register: _okfw_mcp
  changed_when: false

- name: Assert that the MCP server returned an initialize result
  ansible.builtin.assert:
    that:
      - _okfw_mcp.stdout_lines | length > 0
      - (_okfw_mcp.stdout_lines | first | from_json).id == 1
      - (_okfw_mcp.stdout_lines | first | from_json).result is defined
    fail_msg: "okfw mcp did not answer initialize: {{ _okfw_mcp.stdout | default('') }} {{ _okfw_mcp.stderr | default('') }}"
    success_msg: "okfw mcp answered initialize"
...
