# egress-filter-feature/ansible-role-feature/tasks/main.yml
---
# Assert that the devcontainer variant is compatible with this role
- name: Assert that _securedevcontainer_variant is in the _securedevcontainer_compatibility_list
  ansible.builtin.assert:
    that: _securedevcontainer_variant in _securedevcontainer_compatibility_list
    fail_msg: "_securedevcontainer_variant = '{{ _securedevcontainer_variant }}' is NOT in the _securedevcontainer_compatibility_list = '{{ _securedevcontainer_compatibility_list }}'."
    success_msg: "_securedevcontainer_variant = '{{ _securedevcontainer_variant }}' is in the _securedevcontainer_compatibility_list = '{{ _securedevcontainer_compatibility_list }}'."

# ---------------------------------------------------------------------------
# PARAMETER BRACKET — this role has NO defaults. Every value below must arrive
# as an extra-var from install.sh, so a missing one fails here, by name, before
# any work happens.
# ---------------------------------------------------------------------------
- name: Assert that the runner contract was satisfied
  ansible.builtin.assert:
    that:
      - _target_username is defined and _target_username | length > 0
      - _target_user_home is defined and _target_user_home | length > 0
      - _target_arch in ['amd64', 'arm64']
    fail_msg: >-
      This role must be invoked through /opt/bootstrap/run-feature.sh, which
      injects _target_username, _target_user_home and _target_arch.

- name: Assert that every required role parameter was supplied
  ansible.builtin.assert:
    that:
      - _egress_allowed_domains is defined and _egress_allowed_domains | length > 0
      - _egress_squid_port is defined and _egress_squid_port | length > 0
      - _egress_squid_port | string == _egress_container_env_port
      - _egress_squid_port is match('^[0-9]+$')
      - _egress_squid_port | int > 0 and _egress_squid_port | int < 65536
    fail_msg: >-
      A required role parameter was not supplied. This role has NO defaults by
      design — install.sh must pass each one via -e, sourced from the matching
      option default in devcontainer-feature.json:
        _egress_allowed_domains <- allowed_domains
        _egress_squid_port      <- squid_port

        squid_port must equal {{ _egress_container_env_port }}: the http_proxy /
        https_proxy values in devcontainer-feature.json containerEnv are literals
        and the feature spec cannot interpolate an option into them, so any other
        port yields a container whose proxy env points nowhere.

        squid_port must be a number in 1-65535
    success_msg: "egress-filter on 127.0.0.1:{{ _egress_squid_port }}, allowing {{ _egress_allowed_domains }}"

# Install system dependencies
- name: Install system packages (squid, iptables-nft)
  ansible.builtin.include_tasks: /opt/bootstrap/tasks/install-packages.yml
  vars:
    _packages:
      - squid
      - iptables-nft

# Get the squid system user UID for iptables owner matching
- name: Get squid user UID
  ansible.builtin.command: id -u squid
  register: _egress_squid_uid
  changed_when: false

- name: Display squid UID
  ansible.builtin.debug:
    msg: "Squid system user UID: {{ _egress_squid_uid.stdout }}"

# Generate domain ACL file
- name: Generate allowed domains ACL file
  ansible.builtin.copy:
    content: |
      {% for domain in _egress_allowed_domains.split(',') %}
      {{ domain | trim }}
      {% endfor %}
    dest: "{{ _egress_acl_path }}"
    owner: squid
    group: squid
    mode: '0644'

# Write squid configuration
- name: Write squid.conf
  ansible.builtin.copy:
    content: |
      # Squid configuration for egress filtering
      # Managed by egress-filter-feature

      # Listen on localhost only
      http_port 127.0.0.1:{{ _egress_squid_port }}

      # Domain whitelist ACL
      acl allowed_domains dstdomain "{{ _egress_acl_path }}"

      # Allow CONNECT method for HTTPS tunneling
      acl SSL_ports port 443
      acl CONNECT method CONNECT
      http_access allow CONNECT allowed_domains

      # Allow HTTP to whitelisted domains
      http_access allow allowed_domains

      # Deny everything else
      http_access deny all

      # Disable caching
      cache deny all

      # Minimal logging
      access_log daemon:/var/log/squid/access.log squid

      # PID file
      pid_filename /var/run/squid/squid.pid

      # Coredump directory
      coredump_dir /var/spool/squid
    dest: "{{ _egress_squid_conf_path }}"
    owner: root
    group: squid
    mode: '0644'

# Ensure required directories exist with correct ownership
- name: Ensure squid directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: squid
    group: squid
    mode: '0755'
  loop:
    - /var/log/squid
    - /var/spool/squid
    - /var/run/squid

# Write the startup script (executed via postStartCommand)
- name: Write egress-filter-start.sh
  ansible.builtin.copy:
    content: |
      #!/usr/bin/env bash
      #-------------------------------------------------------------------------------------------------------------
      # egress-filter-start.sh
      # Starts Squid proxy and applies iptables egress filtering rules.
      # Executed via devcontainer postStartCommand.
      #-------------------------------------------------------------------------------------------------------------
      set -e

      SQUID_PORT="{{ _egress_squid_port }}"
      SQUID_UID="{{ _egress_squid_uid.stdout }}"

      echo "[egress-filter] Initializing egress filter..."

      # Initialize squid cache directories
      squid -z --foreground 2>/dev/null || true

      # Start squid
      squid
      echo "[egress-filter] Squid proxy started on 127.0.0.1:${SQUID_PORT}"

      # Wait for squid to be ready
      for i in $(seq 1 30); do
          if squid -k check 2>/dev/null; then
              echo "[egress-filter] Squid is ready."
              break
          fi
          if [ "$i" -eq 30 ]; then
              echo "[egress-filter] ERROR: Squid failed to start within 30 seconds."
              exit 1
          fi
          sleep 1
      done

      # Apply iptables egress filtering rules
      echo "[egress-filter] Applying iptables egress rules..."

      # Create a custom chain to avoid conflicts
      iptables -N EGRESS_FILTER 2>/dev/null || iptables -F EGRESS_FILTER

      # Populate the EGRESS_FILTER chain
      # 1. Accept loopback traffic (apps can reach local proxy)
      iptables -A EGRESS_FILTER -o lo -j ACCEPT

      # 2. Accept established/related connections
      iptables -A EGRESS_FILTER -m state --state ESTABLISHED,RELATED -j ACCEPT

      # 3. Accept all outbound from the squid user (proxy reaches internet)
      iptables -A EGRESS_FILTER -m owner --uid-owner "${SQUID_UID}" -j ACCEPT

      # 4. Accept DNS (port 53 UDP and TCP) for all users
      iptables -A EGRESS_FILTER -p udp --dport 53 -j ACCEPT
      iptables -A EGRESS_FILTER -p tcp --dport 53 -j ACCEPT

      # 5. Accept traffic to localhost proxy port
      iptables -A EGRESS_FILTER -p tcp -d 127.0.0.1 --dport "${SQUID_PORT}" -j ACCEPT

      # 6. Drop everything else
      iptables -A EGRESS_FILTER -j DROP

      # Insert jump to EGRESS_FILTER at the top of the OUTPUT chain
      # Remove existing jump first to avoid duplicates on restart
      iptables -D OUTPUT -j EGRESS_FILTER 2>/dev/null || true
      iptables -I OUTPUT 1 -j EGRESS_FILTER

      echo "[egress-filter] Egress filtering is active."
      echo "[egress-filter] Allowed domains:"
      cat /etc/squid/allowed_domains.txt
      echo "[egress-filter] iptables EGRESS_FILTER chain:"
      iptables -L EGRESS_FILTER -n -v
    dest: "{{ _egress_startup_script }}"
    owner: root
    group: root
    mode: '0755'

# Validation
- name: Validate squid configuration syntax
  ansible.builtin.command: squid -k parse
  changed_when: false

- name: Verify iptables binary exists
  ansible.builtin.command: which iptables
  changed_when: false

- name: Verify startup script is executable
  ansible.builtin.stat:
    path: "{{ _egress_startup_script }}"
  register: _egress_startup_stat

- name: Assert startup script is executable
  ansible.builtin.assert:
    that: _egress_startup_stat.stat.executable
    fail_msg: "{{ _egress_startup_script }} is not executable"
    success_msg: "{{ _egress_startup_script }} is executable"

# Cleanup
...
