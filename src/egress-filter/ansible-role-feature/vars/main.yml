# egress-filter-feature/ansible-role-feature/vars/main.yml
---
_securedevcontainer_compatibility_list:
  - ubi9
  - ubi10
  - fedora43

# ---------------------------------------------------------------------------
# ROLE CONSTANTS
#
# Filesystem locations this role owns. Not caller-settable, so they live here
# rather than in defaults/main.yml — defaults/ is reserved for inputs, and this
# role has none.
# ---------------------------------------------------------------------------
_egress_squid_conf_path: "/etc/squid/squid.conf"
_egress_acl_path: "/etc/squid/allowed_domains.txt"
_egress_startup_script: "/usr/local/bin/egress-filter-start.sh"

# The port baked into the containerEnv http_proxy/https_proxy values in
# devcontainer-feature.json. The feature spec has no way to interpolate an
# option into containerEnv, so those values cannot follow _egress_squid_port.
# The PARAMETER BRACKET asserts the two agree rather than handing back a
# container whose proxy env points at a port nothing is listening on.
_egress_container_env_port: "3128"
...
