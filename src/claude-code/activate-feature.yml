# Ansible Playbook
# claude-code-feature/activate-feature.yml
---
- name: Activate DevContainer Feature - Claude Code
  hosts: ubi
  become: true
  gather_facts: false

  roles:
  - role: ansible-role-feature
    vars:
    - _securedevcontainer_variant: "{{ securedevcontainer_variant }}"
    - _claude_code_version: "{{ claude_code_version }}"
    - _target_username: "{{ remote_user }}"
    - _target_user_home: "{{ remote_user_home }}"
...
