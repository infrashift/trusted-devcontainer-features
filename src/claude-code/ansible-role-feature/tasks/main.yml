# claude-code-feature/ansible-role-feature/tasks/main.yml
---
# Assert that the devcontainer variant is compatible with this role
- name: Assert that _securedevcontainer_variant is in the _securedevcontainer_compatibility_list
  ansible.builtin.assert:
    that: _securedevcontainer_variant in _securedevcontainer_compatibility_list
    fail_msg: "_securedevcontainer_variant = '{{ _securedevcontainer_variant }}' is NOT in the _securedevcontainer_compatibility_list = '{{ _securedevcontainer_compatibility_list }}'."
    success_msg: "_securedevcontainer_variant = '{{ _securedevcontainer_variant }}' is in the _securedevcontainer_compatibility_list = '{{ _securedevcontainer_compatibility_list }}'."

# ---------------------------------------------------------------------------
# PARAMETER BRACKET — this role has NO defaults. Every value below must arrive
# as an extra-var from install.sh, so a missing one fails here, by name, before
# any work happens.
# ---------------------------------------------------------------------------
- name: Assert that the runner contract was satisfied
  ansible.builtin.assert:
    that:
      - _target_username is defined and _target_username | length > 0
      - _target_user_home is defined and _target_user_home | length > 0
      - _target_arch in ['amd64', 'arm64']
    fail_msg: >-
      This role must be invoked through /opt/bootstrap/run-feature.sh, which
      injects _target_username, _target_user_home and _target_arch.

- name: Assert that every required role parameter was supplied
  ansible.builtin.assert:
    that:
      - _claude_code_version is defined and _claude_code_version | length > 0
      - _claude_code_version is match('^(latest|\d+\.\d+\.\d+)$')
    fail_msg: >-
      A required role parameter was not supplied. This role has NO defaults by
      design — install.sh must pass each one via -e, sourced from the matching
      option default in devcontainer-feature.json:
        _claude_code_version <- target_version

        target_version must be 'latest' or look like X.Y.Z
    success_msg: "claude-code {{ _claude_code_version }}"

# Claude Code installation tasks
- name: Check if Claude Code is already installed
  ansible.builtin.command:
    cmd: "{{ _target_user_home }}/.bun/bin/claude --version"
  environment:
    HOME: "{{ _target_user_home }}"
    PATH: "{{ _target_user_home }}/.bun/bin:{{ _target_user_home }}/.local/share/nodejs/bin:{{ _target_user_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
  failed_when: false
  register: _claude_code_current_version
  changed_when: false

- name: Display current Claude Code version
  ansible.builtin.debug:
    msg: "Current Claude Code version: {{ _claude_code_current_version.stdout | default('not installed') }}"

# `latest` is an npm dist-tag, not a version, so resolve it to a concrete
# version BEFORE comparing against what is installed. Without this the
# comparison below can never be false for `latest`: whatever is installed always
# "satisfies" the tag, so an old build satisfies it forever and the feature
# silently stops upgrading.
#
# Resolving also means the install below always pins an exact version, and the
# final assert can check that exact version instead of accepting any semver.
- name: Resolve the {{ _claude_code_version }} dist-tag to a concrete version
  ansible.builtin.uri:
    url: "https://registry.npmjs.org/@anthropic-ai/claude-code/{{ _claude_code_version }}"
    return_content: true
    timeout: 30
  register: _claude_code_dist_tag
  when: _claude_code_version == 'latest'
  changed_when: false

- name: Record the Claude Code version to install
  ansible.builtin.set_fact:
    _claude_code_target: >-
      {{ _claude_code_dist_tag.json.version if _claude_code_version == 'latest'
         else _claude_code_version }}

- name: Install Claude Code {{ _claude_code_target }}
  ansible.builtin.command:
    cmd: "{{ _target_user_home }}/.local/bin/bun install -g --trust @anthropic-ai/claude-code@{{ _claude_code_target }}"
  environment:
    HOME: "{{ _target_user_home }}"
    PATH: "{{ _target_user_home }}/.bun/bin:{{ _target_user_home }}/.local/share/nodejs/bin:{{ _target_user_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
  when: _claude_code_current_version.rc != 0
        or _claude_code_target not in _claude_code_current_version.stdout

- name: Get Claude Code version
  ansible.builtin.command:
    cmd: "{{ _target_user_home }}/.bun/bin/claude --version"
  environment:
    HOME: "{{ _target_user_home }}"
    PATH: "{{ _target_user_home }}/.bun/bin:{{ _target_user_home }}/.local/share/nodejs/bin:{{ _target_user_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
  changed_when: false
  register: _claude_code_version_result

- name: Assert that Claude Code is installed
  ansible.builtin.assert:
    that:
      - _claude_code_version_result.rc == 0
      - _claude_code_target in _claude_code_version_result.stdout
    fail_msg: >-
      Expected Claude Code {{ _claude_code_target }}; claude reported:
      '{{ _claude_code_version_result.stdout }}' (rc={{ _claude_code_version_result.rc }})
    success_msg: "Claude Code {{ _claude_code_version_result.stdout }} installed successfully"
...
