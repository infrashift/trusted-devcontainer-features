# Ansible Playbook
# golang-feature/activate-feature.yml
---
- name: Activate DevContainer Feature - Golang
  hosts: ubi
  become: true
  gather_facts: false

  roles:
  - role: ansible-role-feature
    vars:
    # securedevcontainer_variant is a group variable; see hosts.yml
    - _securedevcontainer_variant: "{{ securedevcontainer_variant }}"
    # go_version and go_checksum are parameters passed in from install.sh
    - _go_version: "{{ go_version }}"
    - _go_checksum: "{{ go_checksum }}"
    - _target_username: "{{ remote_user }}"
    - _target_user_home: "{{ remote_user_home }}"
...