# golang-feature/ansible-role-feature/tasks/main.yml
---
# Assert that the devcontainer variant is compatible with this role
- name: Assert that _securedevcontainer_variant is in the _securedevcontainer_compatibility_list
  ansible.builtin.assert:
    that: _securedevcontainer_variant in _securedevcontainer_compatibility_list
    fail_msg: "_securedevcontainer_variant = '{{ _securedevcontainer_variant }}' is NOT in the _securedevcontainer_compatibility_list = '{{ _securedevcontainer_compatibility_list }}'."
    success_msg: "_securedevcontainer_variant = '{{ _securedevcontainer_variant }}' is in the _securedevcontainer_compatibility_list = '{{ _securedevcontainer_compatibility_list }}'."

# ---------------------------------------------------------------------------
# PARAMETER BRACKET — this role has NO defaults. Every value below must arrive
# as an extra-var from install.sh, so a missing one fails here, by name, before
# any work happens.
# ---------------------------------------------------------------------------
- name: Assert that the runner contract was satisfied
  ansible.builtin.assert:
    that:
      - _target_username is defined and _target_username | length > 0
      - _target_user_home is defined and _target_user_home | length > 0
      - _target_arch in ['amd64', 'arm64']
    fail_msg: >-
      This role must be invoked through /opt/bootstrap/run-feature.sh, which
      injects _target_username, _target_user_home and _target_arch.

- name: Assert that every required role parameter was supplied
  ansible.builtin.assert:
    that:
      - _go_version is defined and _go_version | length > 0
      - _go_checksum is defined
      - _go_version is match('^\d+\.\d+\.\d+$')
      - _go_checksum | length == 0 or _go_checksum is match('^[0-9a-fA-F]{64}$')
    fail_msg: >-
      A required role parameter was not supplied. This role has NO defaults by
      design — install.sh must pass each one via -e, sourced from the matching
      option default in devcontainer-feature.json:
        _go_version  <- target_version   (mandatory, non-empty)
        _go_checksum <- target_checksum  (may be empty; uses the pinned map)

        target_version must look like X.Y.Z
        target_checksum, when not empty, must be a 64-character SHA256 hex digest
    success_msg: "go {{ _go_version }} ({{ _go_arch }})"

# Golang installation tasks
- name: Check if Golang is already installed
  ansible.builtin.command: "{{ _target_user_home }}/.local/share/go/bin/go version"
  failed_when: false
  register: _go_version_result
  changed_when: false

- name: Remove current Golang installation
  ansible.builtin.file:
    state: absent
    path: "{{ _target_user_home }}/.local/share/go"
  when:
    - _go_version_result is succeeded
    - _go_version not in _go_version_result.stdout

- name: Create temporary download directory
  ansible.builtin.file:
    path: /tmp/golang-feature-install
    state: directory
    mode: '0755'
  when: _go_version_result.rc != 0
        or _go_version not in _go_version_result.stdout

# A resolved-empty checksum means get_url would SKIP verification rather than
# fail it. Assert it before the download so an unpinned version/arch pair is a
# named error, not a silently unverified binary (ADR-006).
- name: Assert that a checksum is available for Golang {{ _go_version }} ({{ _go_arch }})
  ansible.builtin.assert:
    that: _go_effective_checksum | length > 0
    fail_msg: >-
      No SHA256 is pinned for {{ _go_tarball }} on {{ _go_arch }}. Pass
      target_checksum to install a version or architecture that is not in the
      role's pinned map.
  when: _go_version_result.rc != 0
        or _go_version not in _go_version_result.stdout

- name: Download Golang binary
  ansible.builtin.get_url:
    url: "{{ _go_download_url }}"
    dest: "/tmp/golang-feature-install/{{ _go_tarball }}"
    checksum: "sha256:{{ _go_effective_checksum }}"
    timeout: 60
  when: _go_version_result.rc != 0
        or _go_version not in _go_version_result.stdout

- name: Ensure ~/.local/share directory exists
  ansible.builtin.file:
    path: "{{ _target_user_home }}/.local/share"
    state: directory
    mode: '0755'
    owner: "{{ _target_username }}"
    group: "{{ _target_username }}"

- name: Extract Golang binary
  ansible.builtin.unarchive:
    src: "/tmp/golang-feature-install/{{ _go_tarball }}"
    dest: "{{ _target_user_home }}/.local/share"
    copy: no
  when: _go_version_result.rc != 0
        or _go_version not in _go_version_result.stdout

- name: Ensure ~/.local/share/gopath directory exists
  ansible.builtin.file:
    path: "{{ _target_user_home }}/.local/share/gopath"
    state: directory
    mode: '0755'
    owner: "{{ _target_username }}"
    group: "{{ _target_username }}"

- name: Recursively change ownership of Go installation
  ansible.builtin.file:
    path: "{{ _target_user_home }}/.local/share/go"
    owner: "{{ _target_username }}"
    group: "{{ _target_username }}"
    recurse: true

- name: Remove temporary download directory
  ansible.builtin.file:
    path: /tmp/golang-feature-install
    state: absent

- name: Get Golang version
  ansible.builtin.command:
    cmd: "{{ _target_user_home }}/.local/share/go/bin/go version"
  changed_when: false
  register: _go_version_result

- name: Assert that Golang is installed and accessible
  ansible.builtin.assert:
    that: "'go' ~ _go_version in _go_version_result.stdout"
    fail_msg: "Expected go {{ _go_version }}; go reported: {{ _go_version_result.stdout }}"
    success_msg: "{{ _go_version_result.stdout }}"
...