# openai-codex-feature/ansible-role-feature/tasks/main.yml
---
# Assert that the devcontainer variant is compatible with this role
- name: Assert that _securedevcontainer_variant is in the _securedevcontainer_compatibility_list
  ansible.builtin.assert:
    that: _securedevcontainer_variant in _securedevcontainer_compatibility_list
    fail_msg: "_securedevcontainer_variant = '{{ _securedevcontainer_variant }}' is NOT in the _securedevcontainer_compatibility_list = '{{ _securedevcontainer_compatibility_list }}'."
    success_msg: "_securedevcontainer_variant = '{{ _securedevcontainer_variant }}' is in the _securedevcontainer_compatibility_list = '{{ _securedevcontainer_compatibility_list }}'."

# ---------------------------------------------------------------------------
# PARAMETER BRACKET — this role has NO defaults. Every value below must arrive
# as an extra-var from install.sh, so a missing one fails here, by name, before
# any work happens.
# ---------------------------------------------------------------------------
- name: Assert that the runner contract was satisfied
  ansible.builtin.assert:
    that:
      - _target_username is defined and _target_username | length > 0
      - _target_user_home is defined and _target_user_home | length > 0
      - _target_arch in ['amd64', 'arm64']
    fail_msg: >-
      This role must be invoked through /opt/bootstrap/run-feature.sh, which
      injects _target_username, _target_user_home and _target_arch.

- name: Assert that every required role parameter was supplied
  ansible.builtin.assert:
    that:
      - _codex_version is defined and _codex_version | length > 0
      - _codex_version is match('^(latest|\d+\.\d+\.\d+)$')
    fail_msg: >-
      A required role parameter was not supplied. This role has NO defaults by
      design — install.sh must pass each one via -e, sourced from the matching
      option default in devcontainer-feature.json:
        _codex_version <- target_version

        target_version must be 'latest' or look like X.Y.Z
    success_msg: "openai-codex {{ _codex_version }}"

# OpenAI Codex installation tasks
- name: Check if OpenAI Codex is already installed
  ansible.builtin.command:
    cmd: "{{ _target_user_home }}/.bun/bin/codex --version"
  environment:
    HOME: "{{ _target_user_home }}"
    PATH: "{{ _target_user_home }}/.bun/bin:{{ _target_user_home }}/.local/share/nodejs/bin:{{ _target_user_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
  failed_when: false
  register: _codex_current_version
  changed_when: false

- name: Display current OpenAI Codex version
  ansible.builtin.debug:
    msg: "Current OpenAI Codex version: {{ _codex_current_version.stdout | default('not installed') }}"

# `latest` is an npm dist-tag, not a version, so resolve it to a concrete
# version BEFORE comparing against what is installed. Without this the
# comparison below can never be false for `latest`: whatever is installed always
# "satisfies" the tag, so an old build satisfies it forever and the feature
# silently stops upgrading.
#
# Resolving also means the install below always pins an exact version, and the
# final assert can check that exact version instead of accepting any semver.
- name: Resolve the {{ _codex_version }} dist-tag to a concrete version
  ansible.builtin.uri:
    url: "https://registry.npmjs.org/@openai/codex/{{ _codex_version }}"
    return_content: true
    timeout: 30
  register: _codex_dist_tag
  when: _codex_version == 'latest'
  changed_when: false

- name: Record the OpenAI Codex version to install
  ansible.builtin.set_fact:
    _codex_target: >-
      {{ _codex_dist_tag.json.version if _codex_version == 'latest'
         else _codex_version }}

- name: Install OpenAI Codex {{ _codex_target }}
  ansible.builtin.command:
    cmd: "{{ _target_user_home }}/.local/bin/bun install -g @openai/codex@{{ _codex_target }}"
  environment:
    HOME: "{{ _target_user_home }}"
    PATH: "{{ _target_user_home }}/.bun/bin:{{ _target_user_home }}/.local/share/nodejs/bin:{{ _target_user_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
  when: _codex_current_version.rc != 0
        or _codex_target not in _codex_current_version.stdout

- name: Get OpenAI Codex version
  ansible.builtin.command:
    cmd: "{{ _target_user_home }}/.bun/bin/codex --version"
  environment:
    HOME: "{{ _target_user_home }}"
    PATH: "{{ _target_user_home }}/.bun/bin:{{ _target_user_home }}/.local/share/nodejs/bin:{{ _target_user_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
  changed_when: false
  register: _codex_version_result

- name: Assert that OpenAI Codex is installed
  ansible.builtin.assert:
    that:
      - _codex_version_result.rc == 0
      - _codex_target in _codex_version_result.stdout
    fail_msg: >-
      Expected OpenAI Codex {{ _codex_target }}; codex reported:
      '{{ _codex_version_result.stdout }}' (rc={{ _codex_version_result.rc }})
    success_msg: "OpenAI Codex {{ _codex_version_result.stdout }} installed successfully"

# ON PATH WITHOUT A containerEnv ENTRY. This feature used to announce its
# directory through containerEnv, which the devcontainer CLI emits as a literal
# Dockerfile ENV -- no substitution is available there, so the path had to be
# written as /home/dev and was wrong for any other account. ~/.local/bin is
# already on PATH in every base image here, so a link into it needs no variable
# and is correct whoever the user is.
#
- name: Ensure ~/.local/bin exists
  ansible.builtin.file:
    path: "{{ _target_user_home }}/.local/bin"
    state: directory
    mode: '0755'

- name: Link the binaries into ~/.local/bin so no PATH entry is needed
  ansible.builtin.file:
    src: "{{ _target_user_home }}/.bun/bin/{{ item }}"
    dest: "{{ _target_user_home }}/.local/bin/{{ item }}"
    state: link
    force: true
  loop: ['codex']
...
