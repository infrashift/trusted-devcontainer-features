# dotnet-feature/ansible-role-feature/tasks/main.yml
---
# Assert that the devcontainer variant is compatible with this role
- name: Assert that _securedevcontainer_variant is in the _securedevcontainer_compatibility_list
  ansible.builtin.assert:
    that: _securedevcontainer_variant in _securedevcontainer_compatibility_list
    fail_msg: "_securedevcontainer_variant = '{{ _securedevcontainer_variant }}' is NOT in the _securedevcontainer_compatibility_list = '{{ _securedevcontainer_compatibility_list }}'."
    success_msg: "_securedevcontainer_variant = '{{ _securedevcontainer_variant }}' is in the _securedevcontainer_compatibility_list = '{{ _securedevcontainer_compatibility_list }}'."

- name: Extract the UBI version number from _securedevcontainer_variant
  ansible.builtin.set_fact:
    _securedevcontainer_ubi_version: "{{ _securedevcontainer_variant | regex_replace('^.*?(\\d+)$', '\\1') }}"

- name: Display _securedevcontainer_ubi_version
  ansible.builtin.debug:
    msg: "UBI version number: {{ _securedevcontainer_ubi_version }}"

# Install system dependencies
- name: Configure UBI-{{ _securedevcontainer_ubi_version }}-BaseOS repository
  ansible.builtin.yum_repository:
    name: ubi-{{ _securedevcontainer_ubi_version }}-baseos-rpms
    description: Red Hat Universal Base Image {{ _securedevcontainer_ubi_version }} (RPMs) - BaseOS
    baseurl: https://cdn-ubi.redhat.com/content/public/ubi/dist/ubi{{ _securedevcontainer_ubi_version }}/{{ _securedevcontainer_ubi_version }}/$basearch/baseos/os
    enabled: yes
    gpgkey: file:///etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release
    gpgcheck: true

- name: Install system dependencies (libicu, openssl-libs)
  ansible.builtin.package:
    name:
      - libicu
      - openssl-libs
    state: present

# .NET SDK installation tasks
- name: Check if .NET SDK is already installed
  ansible.builtin.command: "{{ _target_user_home }}/.local/share/dotnet/dotnet --version"
  ignore_errors: true
  register: _dotnet_version_result
  changed_when: false

- name: Create temporary download directory
  ansible.builtin.file:
    path: /tmp/dotnet-feature-install
    state: directory
    mode: '0755'
  when: _dotnet_version_result is failed

- name: Download .NET SDK tarball
  ansible.builtin.get_url:
    url: "{{ _dotnet_download_url }}"
    dest: "/tmp/dotnet-feature-install/{{ _dotnet_tarball }}"
    checksum: "{{ 'sha256:' + _dotnet_checksum if _dotnet_checksum | default('', true) | length > 0 else omit }}"
  when: _dotnet_version_result is failed

- name: Ensure ~/.local/share/dotnet directory exists
  ansible.builtin.file:
    path: "{{ _target_user_home }}/.local/share/dotnet"
    state: directory
    mode: '0755'
    owner: "{{ _target_username }}"
    group: "{{ _target_username }}"

- name: Extract .NET SDK tarball (flat structure, no strip-components)
  ansible.builtin.unarchive:
    src: "/tmp/dotnet-feature-install/{{ _dotnet_tarball }}"
    dest: "{{ _target_user_home }}/.local/share/dotnet"
    copy: no
  when: _dotnet_version_result is failed

- name: Recursively change ownership of .NET installation
  ansible.builtin.file:
    path: "{{ _target_user_home }}/.local/share/dotnet"
    owner: "{{ _target_username }}"
    group: "{{ _target_username }}"
    recurse: true

- name: Remove temporary download directory
  ansible.builtin.file:
    path: /tmp/dotnet-feature-install
    state: absent

- name: Get .NET SDK version
  ansible.builtin.command:
    cmd: "{{ _target_user_home }}/.local/share/dotnet/dotnet --version"
  register: _dotnet_version_result

- name: Assert that .NET SDK is installed and accessible
  ansible.builtin.assert:
    that: "_dotnet_version in _dotnet_version_result.stdout"
    fail_msg: "{{ _dotnet_version_result.stdout }}"
    success_msg: ".NET SDK {{ _dotnet_version_result.stdout }} installed successfully"

# Cleanup
- name: Unset _securedevcontainer_ubi_version
  ansible.builtin.set_fact:
    _securedevcontainer_ubi_version: null
...
