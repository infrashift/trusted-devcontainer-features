# dotnet-feature/ansible-role-feature/tasks/main.yml
---
# Assert that the devcontainer variant is compatible with this role
- name: Assert that _securedevcontainer_variant is in the _securedevcontainer_compatibility_list
  ansible.builtin.assert:
    that: _securedevcontainer_variant in _securedevcontainer_compatibility_list
    fail_msg: "_securedevcontainer_variant = '{{ _securedevcontainer_variant }}' is NOT in the _securedevcontainer_compatibility_list = '{{ _securedevcontainer_compatibility_list }}'."
    success_msg: "_securedevcontainer_variant = '{{ _securedevcontainer_variant }}' is in the _securedevcontainer_compatibility_list = '{{ _securedevcontainer_compatibility_list }}'."

# ---------------------------------------------------------------------------
# PARAMETER BRACKET — this role has NO defaults. Every value below must arrive
# as an extra-var from install.sh, so a missing one fails here, by name, before
# any work happens.
# ---------------------------------------------------------------------------
- name: Assert that the runner contract was satisfied
  ansible.builtin.assert:
    that:
      - _target_username is defined and _target_username | length > 0
      - _target_user_home is defined and _target_user_home | length > 0
      - _target_arch in ['amd64', 'arm64']
    fail_msg: >-
      This role must be invoked through /opt/bootstrap/run-feature.sh, which
      injects _target_username, _target_user_home and _target_arch.

- name: Assert that every required role parameter was supplied
  ansible.builtin.assert:
    that:
      - _dotnet_version is defined and _dotnet_version | length > 0
      - _dotnet_checksum is defined
      - _dotnet_version is match('^\d+\.\d+\.\d+$')
      - _dotnet_checksum | length == 0 or _dotnet_checksum is match('^[0-9a-fA-F]{128}$')
    fail_msg: >-
      A required role parameter was not supplied. This role has NO defaults by
      design — install.sh must pass each one via -e, sourced from the matching
      option default in devcontainer-feature.json:
        _dotnet_version  <- target_version   (mandatory, non-empty)
        _dotnet_checksum <- target_checksum  (may be empty; uses the pinned map.
                                              NOTE: a SHA512, not a SHA256)

        target_version must look like X.Y.Z
        target_checksum, when not empty, must be a 128-character SHA512 hex digest
    success_msg: "dotnet {{ _dotnet_version }} ({{ _dotnet_arch }})"

# libicu and openssl-libs now come from the template base image rather than being installed
# here. This keeps the feature entirely userland, so it runs as the target
# user and needs no privileged lane.

# .NET SDK installation tasks
- name: Check if .NET SDK is already installed
  ansible.builtin.command: "{{ _target_user_home }}/.local/share/dotnet/dotnet --version"
  failed_when: false
  register: _dotnet_version_result
  changed_when: false

- name: Create temporary download directory
  ansible.builtin.file:
    path: /tmp/dotnet-feature-install
    state: directory
    mode: '0755'
  when: _dotnet_version_result.rc != 0

# A resolved-empty checksum means get_url would SKIP verification rather than
# fail it. Assert it before the download so an unpinned version/arch pair is a
# named error, not a silently unverified download (ADR-006).
- name: Assert that a checksum is available for .NET SDK {{ _dotnet_version }} ({{ _dotnet_arch }})
  ansible.builtin.assert:
    that: _dotnet_effective_checksum | length > 0
    fail_msg: >-
      No SHA512 is pinned for {{ _dotnet_tarball }} on {{ _dotnet_arch }}. Pass
      target_checksum to install a version or architecture that is not in the
      role's pinned map.
  when: _dotnet_version_result.rc != 0
        or _dotnet_version not in _dotnet_version_result.stdout

- name: Download .NET SDK tarball
  ansible.builtin.get_url:
    url: "{{ _dotnet_download_url }}"
    dest: "/tmp/dotnet-feature-install/{{ _dotnet_tarball }}"
    checksum: "{{ _dotnet_checksum_algorithm }}:{{ _dotnet_effective_checksum }}"
    timeout: 60
  when: _dotnet_version_result.rc != 0

- name: Ensure ~/.local/share/dotnet directory exists
  ansible.builtin.file:
    path: "{{ _target_user_home }}/.local/share/dotnet"
    state: directory
    mode: '0755'
    owner: "{{ _target_username }}"
    group: "{{ _target_username }}"

- name: Extract .NET SDK tarball (flat structure, no strip-components)
  ansible.builtin.unarchive:
    src: "/tmp/dotnet-feature-install/{{ _dotnet_tarball }}"
    dest: "{{ _target_user_home }}/.local/share/dotnet"
    copy: no
  when: _dotnet_version_result.rc != 0

- name: Recursively change ownership of .NET installation
  ansible.builtin.file:
    path: "{{ _target_user_home }}/.local/share/dotnet"
    owner: "{{ _target_username }}"
    group: "{{ _target_username }}"
    recurse: true

- name: Remove temporary download directory
  ansible.builtin.file:
    path: /tmp/dotnet-feature-install
    state: absent

- name: Get .NET SDK version
  ansible.builtin.command:
    cmd: "{{ _target_user_home }}/.local/share/dotnet/dotnet --version"
  changed_when: false
  register: _dotnet_version_result

- name: Assert that .NET SDK is installed and accessible
  ansible.builtin.assert:
    that: "_dotnet_version in _dotnet_version_result.stdout"
    fail_msg: "{{ _dotnet_version_result.stdout }}"
    success_msg: ".NET SDK {{ _dotnet_version_result.stdout }} installed successfully"

# Cleanup
...
