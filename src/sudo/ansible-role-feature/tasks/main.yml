# sudo-feature/ansible-role-feature/tasks/main.yml
---
# SECURE DEVCONTAINER FEATURE BOOTSTRAP TASKS
# Shortcircuit execution if the Secure DevContainer is incompatible with this role
# _securedevcontainer_variant is detected once from /etc/os-release by the bootstrap
# feature and published as a group var in /opt/bootstrap/inventory.yml.
# Find _securedevcontainer_compatibility_list definition in ./vars/main.yml
- name: Assert that _securedevcontainer_variant is in the _securedevcontainer_compatibility_list
  ansible.builtin.assert:
    that: _securedevcontainer_variant in _securedevcontainer_compatibility_list
    fail_msg: "_securedevcontainer_variant = '{{ _securedevcontainer_variant }}' is NOT in the _securedevcontainer_compatibility_list = '{{ _securedevcontainer_compatibility_list }}'."
    success_msg: "_securedevcontainer_variant = '{{ _securedevcontainer_variant }}' is in the _securedevcontainer_compatibility_list = '{{ _securedevcontainer_compatibility_list }}'."

# ---------------------------------------------------------------------------
# PARAMETER BRACKET — this role has NO defaults. Every value below must arrive
# as an extra-var from install.sh, so a missing one fails here, by name, before
# any work happens.
# ---------------------------------------------------------------------------
- name: Assert that the runner contract was satisfied
  ansible.builtin.assert:
    that:
      - _target_username is defined and _target_username | length > 0
      - _target_user_home is defined and _target_user_home | length > 0
      - _target_arch in ['amd64', 'arm64']
    fail_msg: >-
      This role must be invoked through /opt/bootstrap/run-feature.sh, which
      injects _target_username, _target_user_home and _target_arch.

- name: Install system packages (sudo)
  ansible.builtin.include_tasks: /opt/bootstrap/tasks/install-packages.yml
  vars:
    _packages:
      - sudo

- name: Configure passwordless sudo for {{ _target_username }}
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ _target_username }}"
    content: "{{ _target_username }} ALL=(ALL) NOPASSWD: ALL\n"
    owner: root
    group: root
    mode: "0440"

- name: Validate sudoers syntax
  ansible.builtin.command:
    cmd: "visudo -cf /etc/sudoers.d/{{ _target_username }}"
  changed_when: false
  register: _visudo_result

- name: Assert that sudoers file is valid
  ansible.builtin.assert:
    that: _visudo_result.rc == 0
    fail_msg: "{{ _visudo_result.stderr }}"
    success_msg: "sudoers file for '{{ _target_username }}' is valid"

# Verification is limited to what a container BUILD can actually observe.
#
# `sudo -n true` cannot be used here: sudo authenticates through PAM, and the
# build environment lacks the capabilities PAM needs, so it fails with
# "PAM account management error" even when the sudoers configuration is
# perfectly valid. That is an artefact of the build sandbox, not a defect in
# the installed configuration, and it resolves at container runtime.
#
# So verify the two things that ARE build-observable: the binary is installed
# and the sudoers drop-in parses (validated by visudo above).
- name: Verify the sudo binary is installed
  ansible.builtin.command: command -v sudo
  changed_when: false
  register: _sudo_binary

- name: Assert that sudo is installed and the sudoers drop-in is valid
  ansible.builtin.assert:
    that:
      - _sudo_binary.rc == 0
      - _visudo_result.rc == 0
    fail_msg: "sudo was not installed correctly for '{{ _target_username }}'"
    success_msg: "sudo installed and /etc/sudoers.d/{{ _target_username }} is valid (passwordless sudo takes effect at container runtime)"

