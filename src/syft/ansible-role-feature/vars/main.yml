# syft-feature/ansible-role-feature/vars/main.yml
---
_securedevcontainer_compatibility_list:
  - ubi9
  - ubi10
  - fedora43

# ---------------------------------------------------------------------------
# DERIVED VALUES AND ROLE CONSTANTS
#
# Computed from the inputs install.sh passes. Not caller-settable, so they live
# here rather than in defaults/main.yml — defaults/ is reserved for inputs, and
# this role has none.
#
# _target_arch is injected unconditionally by /opt/bootstrap/run-feature.sh
# (amd64 | arm64), and anchore publishes assets under those same names. It is
# deliberately not masked with `| default(...)`: the mask would hide a broken
# runner by installing an amd64 binary on arm64 that then passes its own
# amd64 checksum from the upstream checksums file.
# ---------------------------------------------------------------------------
_syft_platform: linux
_syft_arch: "{{ _target_arch }}"
_syft_tarball: syft_{{ _syft_version }}_{{ _syft_platform }}_{{ _syft_arch }}.tar.gz
_syft_checksums_file: syft_{{ _syft_version }}_checksums.txt
_syft_download_url: https://github.com/anchore/syft/releases/download/v{{ _syft_version }}/{{ _syft_tarball }}
_syft_checksums_download_url: https://github.com/anchore/syft/releases/download/v{{ _syft_version }}/{{ _syft_checksums_file }}
# Resolved checksum: an explicit _syft_checksum wins, otherwise the value parsed
# from the upstream checksums file (set_fact cannot override an extra-var, so
# the input and the resolved value must be separate names).
_syft_effective_checksum: "{{ _syft_checksum }}"
...
